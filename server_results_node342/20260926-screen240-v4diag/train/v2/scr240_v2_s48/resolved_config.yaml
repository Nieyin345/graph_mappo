project:
  name: qkd_graph_mappo
  output_dir: outputs/experiments
  run_name: v2/scr240_v2_s48
seed:
  global_seed: 48
  env_seed: 48
runtime:
  device: cpu
  dtype: float32
  deterministic: false
  num_threads: 16
  torch_num_threads: 16
  omp_num_threads_env: '16'
  mkl_num_threads_env: '16'
rate_provider:
  provider: h5
  time:
    slot_seconds: 60
    start_index: 0
    end_index: 525600
  rate:
    min_link_rate: 1.0
    unavailable_if_nan: true
    negative_rate_policy: clip_to_zero
  normalization:
    mode: log_p99
    stats_path: null
    p99: null
    eps: 1.0e-08
  h5:
    dataset_dir: dataset/global
    link_data_path: null
    node_registry_path: null
    link_registry_path: null
    rate_dataset_key: k_max
    los_dataset_key: los
    distance_dataset_key: distance
    zenith_dataset_key: zenith
    availability_source: los_and_rate
    out_of_range_policy: zero
    node_name_map: {}
features:
  node:
    include_node_type_one_hot: true
    node_type_dim: 3
    normalize_amount_by: 1000.0
    normalize_amount_log1p: true
    normalize_amount_reference: 1000000.0
    normalize_count_by: 10.0
    normalize_count_log1p: true
    normalize_count_reference: 100.0
    include_qkp_level: true
    include_qkp_capacity_left: true
    include_qkp_utilization: true
    include_demand_in: true
    include_demand_out: true
    include_queue_pressure: true
    include_recent_demand: true
    recent_demand_windows:
    - 15
    - 60
    - 240
    include_is_available: true
    include_time_features: true
    time_features:
      minute_of_day_sin_cos: true
      day_of_year_sin_cos: true
    include_position: false
    position_dim: 3
  edge:
    include_stocked_edges: false
    include_link_type_one_hot: true
    link_type_dim: 4
    include_available_now: true
    include_rate_now: true
    include_rate_future_window: true
    prediction_horizon: 6
    include_available_future_window: true
    include_rate_delta: true
    include_rate_mean: true
    include_rate_max: true
    include_last_activated: true
    include_relay_importance: true
    include_req_hop: true
    relay_importance:
      max_path_links: 8
      hop_decay_factor: 0.8
      wait_urgency_tau_ratio: 0.8
      ignore_consumption: false
      include_stocked_unavailable: true
      capacity_decay_strength: 1.0
      min_scarcity: 0.0
    include_qkp_capacity_left: true
  demand_edge:
    enabled: true
    build_mode: active_pairs
    include_pending_amount: true
    include_pending_count: true
    include_min_deadline_left: true
    include_mean_deadline_left: true
    include_mean_wait_time: true
    include_priority_sum: true
    include_wait_bucket_amounts: true
    wait_bucket_count: 10
    normalize_amount_by: 1000.0
    normalize_amount_log1p: true
    normalize_amount_reference: 1000000.0
    normalize_count_by: 10.0
    normalize_count_log1p: true
    normalize_count_reference: 100.0
    normalize_deadline_by: 0
  action:
    include_idle_action: true
    mask_unavailable_edges: true
    mask_below_min_rate: true
    mask_full_qkp_edges: false
    mask_disallowed_link_types: true
  history_encoder:
    enabled: false
    type: lstm
    hidden_dim: 64
    num_layers: 1
    seq_len: 240
    node:
      include_arrived: false
      include_served: false
      include_failed: false
      include_qkp_total: false
    physical_edge:
      include_qkp_level: false
      include_available: false
      include_activated: false
    demand_edge:
      include_pending_wait_buckets: true
  dims:
    node_dim: auto
    edge_dim: auto
    node_dim_resolved: 17
    edge_dim_resolved: 44
    physical_edge_dim_resolved: 28
    demand_edge_dim_resolved: 16
    history_dim_resolved: 0
    node_history_dim_resolved: 0
    physical_edge_history_dim_resolved: 0
    demand_edge_history_dim_resolved: 0
env:
  name: qkd_full
  episode_steps: 240
  episode_start_mode: random_day
  day_steps: 1440
  terminate_on_year_end: true
  switch_cost:
    enabled: true
    rate_decay_factor: 0.5
  continuous: false
  activation_window_start_day: 0
  activation_window_end_day: 295
  activation_window_days: 295
action_resolver:
  mode: mutual_choice
  score_merge: mean
  tie_break: rate_then_edge_id
  max_candidates_per_node: 3
  max_candidate_edges: 120
scenario:
  mode: full
  num_gs: 4
  num_hap: 1
  num_sat: 1
  allowed_link_types:
  - gs_hap
  - gs_sat
  - hap_sat
  - sat_sat
  active_nodes:
    mode: smart
    gs_count: 30
    hap_count: 30
    sat_count: 30
    exclude:
    - Stockholm
  time_limit:
    days: 298
qkp:
  type: link
  initial_level: 0.0
  key_ttl_steps: 1000000
  overflow_policy: discard
  capacity:
    default: 12000000.0
    per_link_type:
      gs_hap: 20000000.0
      gs_sat: 8000000.0
      hap_sat: 8000000.0
      sat_sat: 12000000.0
    per_edge: {}
requests:
  source: generator
  type: poisson
  arrival_rate: 0.8
  amount_mean: 100000.0
  deadline_steps: 30
  priority_mode: uniform
  steps_per_hour: 60
  hourly_weights:
  - 0.15
  - 0.1
  - 0.1
  - 0.1
  - 0.1
  - 0.15
  - 0.3
  - 0.6
  - 1.0
  - 1.2
  - 1.1
  - 1.0
  - 0.9
  - 0.8
  - 0.9
  - 1.0
  - 1.1
  - 1.2
  - 1.3
  - 1.2
  - 1.0
  - 0.8
  - 0.5
  - 0.25
  pair_hotness: zipf
  pair_zipf_s: 1.0
  pair_seed: 0
  amount_max: 500000.0
routing:
  mode: link_path
  path_selection: shortest_available_path
  serve_order: earliest_deadline_first
reward:
  success_enabled: true
  success_delta_enabled: false
  success_delta_weight: 50
  served_enabled: true
  attribution_enabled: false
  history_utilization_ratio: 0.3
  raw_generation_enabled: true
  dense_enabled: false
  storage_enabled: true
  storage_reward_weight: 0.5
  storage_reference: 1000000.0
  failed_enabled: true
  waiting_enabled: false
  switch_enabled: false
  overflow_enabled: false
  expired_key_enabled: true
  conflict_enabled: false
  mode: shaped
  served_reference: 100000.0
  served_weight: 50.0
  generated_weight: 0.0
  dense_generation_importance_weight: 0.02
  dense_low_importance_penalty: 0.01
  dense_reference: 1000000.0
  dense_normalize_by_added: true
  failed_weight: 5.0
  waiting_weight: 0.0
  waiting_stock_weight: 0.0
  switch_weight: 0.001
  overflow_weight: 0.0
  conflict_weight: 0.0
  expired_key_weight: 0.01
  penalty_reference: 1000000.0
  normalize_penalties_by_arrived: true
  normalize_by_arrived_demand: false
  normalize_window: 60
  normalize_floor: 10000.0
  clip_abs: 0.0
  keep_active_enabled: true
  keep_active_weight: 0.001
  reward_scale: 0.002
model:
  name: graph_mappo
  mode: mixed
  encoder:
    gnn_type: graphsage
    node_dim: auto
    edge_dim: auto
    hidden_dim: 128
    num_layers: 3
    activation: relu
    dropout: 0.0
    layer_norm: true
    residual: true
    share_actor_critic_encoder: true
  actor:
    share_actor_across_node_types: true
    edge_scorer_hidden_dims:
    - 128
    - 128
    idle_scorer_hidden_dims:
    - 128
    temperature: 1.0
    demand_residual:
      enabled: false
      num_heads: 4
  critic:
    pooling: typed_mean
    hidden_dims:
    - 128
    - 128
  distribution:
    type: masked_categorical
    invalid_logit_value: -1000000000.0
train:
  temperature_schedule:
    start: 1.2
    end: 1.0
    updates: 1000
  num_updates: 20
  rollout_steps: 240
  episodes_per_update: 8
  n_rollout_workers: 8
  rollout_worker_device: cpu
  rollout_batch: true
  gamma: 0.99
  gae_lambda: 0.95
  value_target: gae
  ppo:
    epochs: 1
    minibatch_size: 256
    clip_eps: 0.1
    batch_chunk: 16
    normalize_advantages: true
    entropy_coef: 0.01
    value_coef: 0.5
    max_grad_norm: 0.5
    target_kl: 0.02
  optimizer:
    type: adam
    actor_lr: 3.0e-05
    critic_lr: 0.0003
  logging:
    log_interval: 1
    checkpoint_interval: 10
    eval_interval: 10
    eval_episodes: 1
    eval_steps: 1440
  episode_days_min: 1
  episode_days_max: 2
  replay_days: 0
validation:
  window:
    start_day: 330
    end_day: 365
  request_seeds:
  - 100
  - 101
  - 102
  - 103
  - 104
  - 105
  - 106
  - 107
  - 108
  - 109
  - 110
  - 111
  - 112
  - 113
  - 114
  episodes: 15
  episode_steps: 240
  start_mode: random_day
experiment:
  model: v2
  cpu_threads: 16
  bc:
    episodes: 8
training_budget:
  min_nb: 8
