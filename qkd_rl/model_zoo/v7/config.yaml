# v7 keeps the validated v3 service scorer and adds a second matching stage.
# Stage one can only use edges on a current request path. Stage two scores the
# remaining legal arcs from 240-step pair history, stock shortage and the v3
# arc embedding. The request-distribution v2 overlay must be loaded separately.
experiment:
  model: v7
model:
  mode: mixed
  encoder:
    fuse_demand_to_node: true
  actor:
    attention_only: true
    demand_residual:
      enabled: false
    path_edge_attention:
      enabled: false
    pair_path_attention:
      enabled: true
      arc_query: true
      num_heads: 4
      # Match the v3 control so the experiment isolates the two-stage policy.
      max_hops: 4
    two_stage:
      enabled: true
      phase: joint
