# PPO calibration after fixing the global-matching probability contract.
#
# The matching policy samples one autoregressive JOINT action per env step.
# PPO therefore uses the SUM of conditional log-probabilities, not their mean.
# Historical actor_lr=3e-4 was tuned under the old mean-logprob pseudo-ratio and
# is too aggressive once the mathematically correct joint ratio is restored.
#
# Bounded server calibration (same checkpoint/seed, 64 steps x 2 envs, 4 MBs):
#   actor_lr=1e-4 -> joint KL 0.0318/0.0348, clip 0.430/0.492
#   actor_lr=5e-5 -> joint KL 0.0102/0.0104, clip 0.305/0.344
#   actor_lr=3e-5 -> joint KL 0.0055/0.0042, clip 0.211/0.164
# Full-regime gate (1440 steps x 8 envs, 45 minibatches, seed 42, OMP=8):
#   actor_lr=5e-5 -> joint KL 0.0113, clip 0.397, ratio 1.0008, 45/45 MBs ran.
# So the KL early-stop no longer truncates the update at the 4-minibatch guard.
# Keep target_kl=0.02 in JOINT-action units; 5e-5 is a validated long-run start,
# but clip_frac is still high enough that the first few updates must be watched.
# This preset must be loaded AFTER rl_algorithm.yaml / train_full_rl.yaml.
train:
  optimizer:
    actor_lr: 0.00005
  ppo:
    target_kl: 0.02
