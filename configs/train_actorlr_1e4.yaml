# ---------------------------------------------------------------------------
# actor_lr 扫描（低侧）：0.0003（现行） → 0.0001
#
# ### 为什么是它 —— 这是本项目**唯一**直接对准"actor 被冻住"这个诊断的旋钮
#
# 已记的诊断：`critic 漂移 1.43 / actor 0.047（30 倍，学习率差只有 3.33 倍）`，
# 根因是 **critic 拟合好 → advantage 塌到 0.37 → actor 梯度弱**。
# 已记的机制读数：**一轮只做一次梯度步，而那一步把策略分布只挪了 0.1%**
# （kl ≈ 0.003~0.004，clip_eps 与 target_kl 两个闸门因此从未激活）。
# ⟹ **策略的移动被步长本身卡住了**，actor_lr 是唯一正对这个的旋钮。
#
# ### 为什么它至今**没有被真正扫过**（三条，缺一条都不够）
#
#   1. `load_checkpoint` bug 让配置里的 0.0003 从未生效，历史 run 实际全跑在 0.001。
#   2. 唯一那次同种子对照（`r6_base` vs `r6_base_lr1e4`，只差这一个字段）
#      差 +0.0052，**低于 0.035 的单种子分辨率 ⟹ 测不出**。
#   3. 第二轮那批筛选（`lr1e4`/`lr1e3`/`lr3e3`）**跑在 ent=0.001 上**，
#      而 ent=0.001 是已知的错误值（ent01 才是现用值）
#      ⟹ 即使那批数字有效，也不能搬到现在的操作点。
#
# ### ⚠ 方向未定，**不要**相信那批旧筛选给的排序
#
# 诊断记录里那批 r2 筛选的绪论写的是「学习率越小越好」，
# 但它自己那张表**不支持这句话**：0.0001 → 0.8085，0.0003 → 0.8119，
# 即更小的 0.0001 反而**更低**（差 0.0034，远低于 0.035 分辨率）
# ⟹ 真实读数是 **0.0001 ≈ 0.0003（测不出差异）**，
#   而 0.003（+0.0191）与 0.001（−0.0104）都明显更差。
# 再加上第 3 条（那批是 ent=0.001 + 诊断场景），**方向目前是未定的**。
# 所以本文件的态度是"**只是没量过**"，不是"知道它更好"。
#
# ### 两条一起跑的原因：**方向未定就只能双向下注**
#
# 只知道「0.001 是坏的、0.003 也不好」，中间（0.0003 附近）是平的。
# 只扫一侧得到"无差异"时**没法解释**（是没效果，还是走错边了？）；
# 两侧都有 = 区间。
#
# ### 成本与破坏面
#
# · 不动任何张量形状 ⟹ **不需要 BC 起点迁移**。
# · 1 维扫描、3 臂、30 轮、**8 线程**（必须与对照臂 ent01_t8_* 相同，
#   线程数确定性改变结果，差 0.018）。
#
# ### 判据（跑之前写死）
#
# n=3（df=2）分辨率约 0.035；历史单种子抖动 0.012。与对照臂
# `ent01_t8_s{42,43,44}` 配对（那是对照臂**存在**的种子）。
#   |Δ| 可测 ⟹ 有结论；否则一律报「以 n=3 测不出」，**不报「没影响」**。
#
# ★ 起臂后必须跑 `scripts/diag/audit_arm_vs_control.py` 核对
#   **运行时线程数**（本波已因线程数污染作废过一波 gae99）。
#
# ### 本文件必须排在 train_full_rl.yaml / train_ent01.yaml **之后**（后覆盖前）
#
# 用法：
#   OMP_NUM_THREADS=8 MKL_NUM_THREADS=8 /opt/qkd/venv/bin/python -u \
#       scripts/train/train_graph_mappo.py \
#       --configs rl_algorithm.yaml train_full_rl.yaml train_ent01.yaml \
#                 train_actorlr_1e4.yaml \
#       --checkpoint outputs/supervised_pg_phased/supervised_pg_phased_latest.pt \
#       --seed 42 --num-updates 30 --run-name alr1e4_s42
# ---------------------------------------------------------------------------
train:
  optimizer:
    actor_lr: 0.0001
