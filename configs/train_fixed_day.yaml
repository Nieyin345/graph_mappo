# Fixed-day training: every episode starts at t=0 and runs exactly 1440 steps
# (one day). Reward/features stay the default B1 shaped config from env_full.
env:
  episode_start_mode: fixed
  episode_steps: 1440

train:
  num_updates: 20
  rollout_steps: 1440
  episodes_per_update: 1
  n_rollout_workers: 1
  rollout_batch: true
  value_target: mc
  ppo:
    epochs: 1
    minibatch_size: 256
    batch_chunk: 256
    entropy_coef: 0.001
  logging:
    log_interval: 1
    checkpoint_interval: 5
    eval_interval: 10
    eval_episodes: 1
