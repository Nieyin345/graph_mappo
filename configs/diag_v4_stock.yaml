# ============================================================================
# v4 归因分解臂：库存边（stocked edges）
#
# 单变量：只打开 `include_stocked_edges`，其余同 v3 默认。
# 动机与判据见 diag_v4_iso.yaml 头部注释（同一波实验）。
#
# ⚠ 本项 v3 代码已支持（graph_builder.py:214），可在 v3 上单测。
# ⚠ 改了 features ⟹ **BC 必须重跑**（BC 会 merge features 段），
#    不能复用 v3 默认臂的 BC 起点。
# ============================================================================
features:
  edge:
    include_stocked_edges: true
