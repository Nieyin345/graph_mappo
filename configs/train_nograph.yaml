# 去图臂：`model.encoder.num_layers: 3 → 0`（**消息传递完全消失**）
# ══════════════════════════════════════════════════════════════════════════
# 一、这条同时回答两个问题（本表 E1，第一优先）
# ══════════════════════════════════════════════════════════════════════════
#
# **问题 ①（H₁ 的拆分假设）**：`00_研究方向.md` §3 的原文——
#   「**GNN 相对纯 MAPPO 无增益 → GNN 贡献不成立**（拆分假设）」
#   ⟹ 它要的正是「**有消息传递 vs 无消息传递**」的对照。
#
# **问题 ②（模型合理性）**：2026-09-21 体检（§三十三）——
#   `encoder.layers` 占**参数量的 79.8%**，而 `layers4`（3→4 层）**测不出**（<1.3 点）
#   ⟹ **这块容量既没被证明不足、也没被证明必要**。本臂直接问它值不值。
#
# ══════════════════════════════════════════════════════════════════════════
# 二、改动（唯一变量）
# ══════════════════════════════════════════════════════════════════════════
#
#   `model.encoder.num_layers`:  3 → **0**
#
# `graph_mappo.py:388` 的 `run_layers` 遍历 `self.layers`；
# `num_layers: 0` ⟹ `self.layers` **为空** ⟹ **一条消息都不传**。
# 节点表示只剩「自身特征投影」（`node_proj`）+ 边投影，图结构消失。
#
# ══════════════════════════════════════════════════════════════════════════
# 三、前提已核实（§三十二，`probe_optmom2.py`）
# ══════════════════════════════════════════════════════════════════════════
#
# | 判据 | 结果 |
# |---|---|
# | 差异字段 | **恰好 1 个**（`model.encoder.num_layers`） |
# | 维度 | `node_dim 17` / `edge_dim 44` **不变** |
# | BC 暖启动 | 加宽 0 / **丢弃 0** / **缺失 0** / 多余 72 |
# | 多余的 72 个 | **全部是 `encoder.layers.*`** —— 那是**该丢的**（层没了） |
# | ★ **Adam 动量** | **共享部分逐位保留**（19/19 相同、0 不同） |
#
# ★★ 最后一条推翻了 `docs/定稿结论.md` §3.3 第 0 条的否决：
#   那条说「`num_layers: 0` ⟹ 删中间 3 层 ⟹ 优化器状态索引缺 72 个 ⟹
#   early return ⟹ **整份 Adam state 被丢弃** ⟹ 是**两个变量**」。
#   **但那条 early return 已被 `decb2c3` 改掉**（改成按参数名重映射）
#   ⟹ 实测共享部分动量**逐位保留** ⟹ **否决已过期，本臂是单变量**。
