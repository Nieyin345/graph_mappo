train:
  # Canonical training preset: full-day rollouts with broad time coverage.
  # Use this as the main config unless you explicitly want a short debugging run.
  # Temperature annealing: start>1.0 for exploration, anneal to end (usually 1.0)
  # over `updates` updates. Default 1.0 -> 1.0 = disabled (same as before).
  temperature_schedule:
    start: 1.2
    end: 1.0
    updates: 1000
  num_updates: 10000
  rollout_steps: 1440
  episodes_per_update: 8
  # CPU is the rollout bottleneck (environment feature construction +
  # matching). Run one episode per worker on CPU, then keep PPO updates on the
  # main runtime.device (CUDA when available).
  n_rollout_workers: 4
  rollout_worker_device: cpu
  # Lockstep batched rollout: all episodes_per_update envs run in
  # parallel inside one process; every time step acts on all graphs with a
  # single block-diagonal forward instead of one tiny CUDA forward per graph.
  rollout_batch: true
  gamma: 0.99
  gae_lambda: 0.95
  # Critic target: "gae" (default) = standard GAE returns (advantage +
  # bootstrapped value). This is the canonical PPO critic target: low variance
  # from the bootstrap, and the per-batch Huber beta (critic_beta = batch
  # return std) already absorbs return-scale drift, so the old "mc" workaround
  # (bootstrap-free MC returns, which were added to break a value-normalizer
  # feedback loop that no longer exists in this code) is no longer needed.
  # "mc" is still accepted for ablation studies.
  value_target: gae
  ppo:
    # 1 epoch per update: with 4 episodes x 1440 steps the update already sees
    # 5760 samples; the backward pass through the block-diagonal GNN is the
    # dominant training cost on CPU, so multiple epochs multiply it without
    # adding new data. This is the standard PPO setting (SB3/cleanrl default
    # to 1-2 epochs).
    epochs: 1
    minibatch_size: 1024
    clip_eps: 0.2
    # PPO eval chunk: one block-diagonal forward per chunk (pure
    # implementation-level kernel merging, same math).
    #
    # 64, down from 512. The chunk sets how many steps go into one forward, so
    # it sets the size of the edge tensor the backward walks: at ~393 directed
    # edges per step, 512 steps is ~103 MB -- the whole L3 of the machine this
    # was tuned on. At 64 it is ~13 MB and stays resident.
    #
    # Measured on the canonical preset (1440x8), interleaved two rounds so the
    # first-update warm-up could not land on one setting:
    #     512 -> 94.06 / 72.40 s   (median 83.2, and it swings 30% between runs)
    #     128 -> 67.10 / 66.91 s   (median 67.0)
    #      64 -> 61.59 / 61.65 s   (median 61.6)
    # 1.35x on the update, and it also removes the variance: 512 sits right at
    # the cache boundary and its timing depends on what else is on the box.
    batch_chunk: 64
    normalize_advantages: true
    # EMA update rate of the running return statistics used to standardize the
    # critic target. Set to 0 to keep the return scale fixed for generalized
    # training across time windows.
    entropy_coef: 0.01
    value_coef: 0.5
    max_grad_norm: 0.5
    target_kl: 0.03
  optimizer:
    type: adam
    actor_lr: 0.0003
    critic_lr: 0.001
  logging:
    log_interval: 1
    checkpoint_interval: 100
    eval_interval: 200
    eval_episodes: 4
