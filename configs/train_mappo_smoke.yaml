# Fixed-scenario smoke run: validate model + reward design on ONE scenario.
#
#   env: day 0 only (episode_start_day=0, single 360-step episode)
#   requests: fixed across updates (fixed_episode_seed -> seeds 7..14 replay
#     every update), so the per-update training mean_success_rate is directly
#     comparable and isolates learning in one scenario.
#
#   NOTE (v10): episode_steps == rollout_steps == 360 (unified). The env
#     terminates naturally at 360 (env.terminated = steps >= episode_steps),
#     so GAE never bootstraps a truncated horizon — no critic-dependent
#     last_value pollution. The shorter window also lowers memory/GPU load.
#     Training success-rate is computed over this 360-step window only.
#
# Usage:
#   python scripts/train/train_graph_mappo.py --configs train_mappo_smoke.yaml \
#       --checkpoint outputs/supervised_pg_phased/supervised_pg_phased_latest.pt \
#       --run-name rl_smoke_day0
env:
  episode_start_mode: fixed
  episode_start_day: 0
  episode_steps: 360
  continuous: false
  activation_window_start_day: 0
  activation_window_days: 0
  activation_window_end_day: -1
scenario:
  time_limit:
    days: 2
train:
  num_updates: 60
  rollout_steps: 360
  # 16GB laptop: buffer must stay small (obs ~1.3MB each). 8 episodes x 360
  # steps = ~3.7GB buffer; 4 worker processes add ~2.8GB. Worker-pool rollout
  # is the proven path (v2 completed updates); the single-process batched
  # rollout stalls with VRAM pinned at 7.8GB.
  episodes_per_update: 8
  episode_steps_fixed: true
  fixed_episode_seed: true
  # Proven worker-pool rollout: 4 workers x 2 episodes each. CPU forward per
  # worker ~175ms/step; 8 seeds keep the per-update mean stable.
  n_rollout_workers: 4
  rollout_worker_device: cpu
  rollout_batch: true
  temperature_schedule:
    start: 1.05
    end: 1.0
    updates: 60
  ppo:
    # v9: BC warm-start is already near-expert (0.862), so high-temperature
    # exploration (1.2) only pushed the policy toward uniform (entropy
    # 3.33->4.01) and every seed regressed slightly. Use mild exploration.
    # minibatch 1024 gave only ~3 grad steps/update (2880/1024) — too few to
    # learn; 256 gives ~11 steps. target_kl 0.02 tripped KL-stop immediately.
    minibatch_size: 256
    target_kl: 0.03
    # 8GB laptop GPU: the 512-graph block-diagonal forward OOMs; 256 halves
    # the peak update memory while keeping the same math (pure chunk size).
    batch_chunk: 256
  logging:
    log_interval: 1
    checkpoint_interval: 10
    # Skip held-out validation during the smoke run: watch the per-update
    # training mean_success_rate on the fixed scenario instead.
    eval_interval: 0
seed:
  env_seed: 7
