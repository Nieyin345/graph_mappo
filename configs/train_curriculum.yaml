# Curriculum training: start with short episodes (frequent updates, easy
# horizon) and gradually lengthen to the full-day schedule.
# - value_target: gae so truncated short episodes bootstrap the future via
#   the critic instead of becoming myopic MC returns.
train:
  num_updates: 400
  rollout_steps: 240
  episodes_per_update: 4
  rollout_batch: true
  n_rollout_workers: 1
  gamma: 0.99
  gae_lambda: 0.95
  value_target: gae
  ppo:
    epochs: 1
    minibatch_size: 512
    clip_eps: 0.2
    batch_chunk: 256
    normalize_advantages: true
    value_norm_tau: 0.05
    entropy_coef: 0.001
    value_coef: 0.5
    max_grad_norm: 0.5
    target_kl: 0.03
  optimizer:
    type: adam
    actor_lr: 0.0003
    critic_lr: 0.001
  logging:
    log_interval: 1
    checkpoint_interval: 25
    eval_interval: 25
    eval_episodes: 2
  curriculum:
    stages:
      - until_update: 60
        rollout_steps: 240
        episodes_per_update: 4
      - until_update: 120
        rollout_steps: 480
        episodes_per_update: 4
      - until_update: 200
        rollout_steps: 720
        episodes_per_update: 2
      - until_update: 400
        rollout_steps: 1440
        episodes_per_update: 2
