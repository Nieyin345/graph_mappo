# `model.critic.pooling: typed_mean → mean`（**去掉分型池化**）
# ══════════════════════════════════════════════════════════════════════════
# 一、为什么是这条（E7，结构类）
# ══════════════════════════════════════════════════════════════════════════
#
# `graph_mappo.py:707` 的 `GlobalCritic` 支持两种 pooling：
#
#   `typed_mean`（现用）: 节点平均 + **物理边平均** + **需求边平均** + 3 个规模计数
#                         ⟹ value_head 输入 = `hidden*3 + 3` = **387**
#   `mean`:               节点平均 + **所有边一起平均**
#                         ⟹ value_head 输入 = `hidden*2` = **256**
#
# **两者对"图的类型结构"的利用方式不同**：
# `typed_mean` 告诉 critic「物理边与需求边是两类东西」（分开池化）；
# `mean` 把它们混在一起。
#
# 本项目**从未扫过** —— 全库 78/78 条臂全是 `typed_mean`。
#
# ══════════════════════════════════════════════════════════════════════════
# 二、与已有结论的关系
# ══════════════════════════════════════════════════════════════════════════
#
# ★ 本臂与 `cmax`（`pool_include_max`）**互补**：
#   · `cmax` 测的是「**加一路 max** 池化」（保留 typed_mean + 追加）
#     ⟹ 已测：Δ=+0.0023，测不出（影响 < 0.8 点）
#   · 本臂测的是「**去掉分型**」（typed_mean → mean）
#   ⟹ 问的是「**分不分型**要不要紧」
#
# 两者一起，能把「critic 的池化方式」这个维度测完整。
#
# ══════════════════════════════════════════════════════════════════════════
# 三、代价：**会改 value_head 输入宽度**（387 → 256）
# ══════════════════════════════════════════════════════════════════════════
#
# ⚠ 这是**变窄**，`_upgrade_state_dict_for_model` **救不回**（只能救变宽）。
# 但 ★ **critic value_head 本来就每次运行都被重置**
#   （`mappo_trainer.py:1691`：`reward config differs from checkpoint:
#    re-initialized critic value head`）⟹ **改它不额外损失任何东西**。
#   而 **actor 与共享 encoder 的 BC 暖启动完整保留**。
#
# **⟹ 仍需起臂前跑预检**确认：缺失/多余是否**只涉及 `critic.value_head.*`**。
#    ⚠ 若 missing/unexpected **成对等量且涉及非 critic 的键** ⟹ 索引位移，别起。
#
# ══════════════════════════════════════════════════════════════════════════
# 四、判据（预注册）
# ══════════════════════════════════════════════════════════════════════════
#
# 对照臂：`ent01_rerun_s{42..46}`；窗口 u25/u30；族级配对 n=5（临界 2.776）
# + **报可检测效应**
#
#   Δ ≤ −0.020 且 5/5 同向 ⟹ **分型池化必要**（critic 需要知道边的类型）
#   Δ ≥ +0.020 且 5/5 同向 ⟹ 分型是**多余复杂度**
#   |Δ| < 0.020 ⟹ 测不出
#
# ⚠ 本文件必须排在 `train_ent01.yaml` **之后**（后覆盖前）。
model:
  critic:
    pooling: mean
