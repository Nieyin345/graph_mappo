# entropy_coef: 0.01 → 0.03（再往上推一档）
#
# ### 为什么测这一档
#
# `ent=0.01` 是全项目**唯一**超过专家的单参数改动（合并 n=5，p=0.0074）。
# 也就是说：**本项目唯一确认有效的方向，就是"把熵推大"**。
# 而 0.01 这个值是**一次跳 10 倍**跳出来的（0.001 → 0.01），
# **中间和上面都没测过** —— 不知道它是单调还是已经过了峰。
#
# ### 依据（2026-09-19 实测，`.tmp/check_entropy_by_group.py`）
#
#   组                 n   熵上升/下降   首均值   末均值   Δ均值
#   entropy_coef=0.001 9    9 / 0       3.148   3.640   +0.492
#   entropy_coef=0.01  9    8 / 0       3.564   4.268   +0.704
#
#   ★ 两组**都是上升**（"0.001 时探索坍缩"这个说法已被证伪）。
#     差别是**平台高度**：0.001 停在 ~3.6，0.01 停在 ~4.27。
#   且 u30→u50 延长臂平台 4.23~4.41，只比 u30 高 +0.15/-0.005/+0.18
#     ⟹ **熵约在 u30 饱和，加轮数推不开**。
#
#   所以"更有效"和"熵更高"在现有数据里是同向的 ⟹ 值得再推一档，
#   看它是**单调**（那还能更高）还是**已过峰**（那 0.01 附近就是最优）。
#
# ### 判据（跑之前写死）
#
# 逐种子配对 Δ_s = sr(ent=0.03) − sr(ent=0.01)，种子 42/43/44，
# 对照臂 = **已有的** `ent01_s42/43/44`（4 线程、同链、同 BC、同 30 轮）。
# 单样本 t，df=2，临界值 **4.303**（不是 2 —— 本项目在这里栽过）。
#
#   |t| ≥ 4.303 且 Δ>0 ⟹ 单调，**还能再往上推**
#   |t| ≥ 4.303 且 Δ<0 ⟹ 已过峰，0.01 附近是最优（**负结论也值钱**）
#   |t| < 4.303        ⟹ 测不出，只能说"这一档没看出差别"
#
# ★ 必须用 **4 线程**：对照臂 ent01_s42/43/44 是 4 线程跑的，而线程数会
#   确定性改变结果（见 [[thread-count-changes-training]]）。用 8 线程
#   会让这一配对失效。
#
# 用法：
#   python scripts/train/train_graph_mappo.py \
#       --configs rl_algorithm.yaml train_full_rl.yaml train_ent01.yaml train_ent03.yaml \
#       --checkpoint outputs/supervised_pg_phased/supervised_pg_phased_latest.pt \
#       --seed 42 --num-updates 30 --run-name ent03_s42

train:
  ppo:
    entropy_coef: 0.03
