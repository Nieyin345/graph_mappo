# v1：给物理边新增一列「通路成员资格」——**只改这一个点**
#
# 依据（**真实验证协议**上只读实测，2026-09-20；详见 docs/训练诊断记录.md
# 的「机制体检」一节，三个探针在 .tmp/）：
#
#   覆盖全部在挂请求路径所需的**不同跳数** U   p50 **9**（p95 22）
#   实际激活弧数                              **60**
#   端口预算 = 节点数 90，U/90 = 0.10           ⟹ 端口**不是**约束
#   挡路的**空跳**里上一步被激活过的             **0.00**
#
# ⟹ 约束不是"配额不够"，是**"打错了地方"**：策略激活 60 条高分边，
#   而真正卡住那 9 条请求的跳**一条都没被激活过**。
#
# 模型原有的两个代理信号都不表达「成员资格」：
#   · `include_req_hop`（4 列）= 端点到最近请求源/宿的 **hop 数** —— 是**距离**，
#     "在通路上"与"离通路很近"在它眼里几乎一样
#   · `include_relay_importance` 是图上的**软扩散**，同样不是成员资格
#
# 本改动只加 **1 维** `include_on_pending_path`：该边**当前有存量**、
# **且**在某个待服务请求的一条「有存量边上」最短路路径上 —— 与
# `routing.py:_find_positive_path` **服务时用的同一张子图、同一个判据**。
#
# ⚠ 反例（实测否掉的另一条路）：`include_qkp_level`（level/capacity）**不能**加。
#   它与已有的 `include_qkp_capacity_left` **完全共线**（互为 1−x），而且实测
#   `level/capacity` 的 `p25=0 / p50=0.04 / p95=1.0` ⟹ 存量信息**已经在输入里**。
#   缺的从来不是"这一跳有多少"，是**"这一跳要不要紧"**。
#
# **预注册判据**（先写死，避免事后挑窗口）：
#   主判据：留出协议（天 330–365，240 步，种子 100–114，确定性）上，
#           3 个训练种子 v1_s42/s43/s44 配对 ent01_rerun_s42/s43/s44，
#           **Δ ≥ +0.020 且 3/3 同向**
#   反向 ：Δ ≤ −0.010 ⟹ 这条信息**有害**，撤回
#   居中 ：|Δ| < 0.010 ⟹ 判"信息不足以改变行为"，转去查**为什么 60 个激活
#           里没有一个落在关键跳上**（是打分、还是动作空间的相位问题）
#
# ★★ 窗口（2026-09-20 补记，**在结果出来之前**钉死；见 `verdict-window-is-part-of-the-claim`
#    ——「判据的窗口是结论的一半」，事后挑窗口 = 挑到显著的那个）：
#
#   主判据窗口 = **u25, u30**（与 `scripts/diag/paired_verdict.py` 的默认
#                `--plateau 25,30` 一致，也与 gae90 那次的预注册窗口一致）
#   副判据    = **逐轮 Δ 全轨迹 u1→u30**（不带窗口）。用途是看**结构**：
#               "整体上移"与"早负晚正交叉"含义完全不同 —— gae90 那次就是
#               只在 u25/u30 过线、早期显著为负，所以那条结论只能写"交叉"不能写"提升"。
#
#   n 的说明：s42/43/44 三条已跑完基线与 v1；**另补 s45/s46 到 n=5**，
#   理由是主判据要求"同向"，而 n=3 只有 df=2、临界值 **4.303** 太钝；
#   n=5 是 df=4、临界 **2.776**。补种子的决定**在看到任何 v1 结果之前**做出。
#
# ⚠ 独立性限制：五条 v1 与五条基线都从**同一个 BC checkpoint** 长出来、
#   共享早段路径 ⟹ 配对差 d_s 在种子间**不完全独立**。所以结论只能写
#   「在该共同起点下的这 5 个种子上」，**不能**写"独立复现"。
#
# 基线臂是 `ent01_rerun_s{42,43,44}`（现用做法：entropy_coef 0.01 + 暖启动），
# 本臂与它**唯一**的差别就是这个特征开关。
#
# 用法：
#   python scripts/train/train_graph_mappo.py \
#       --configs rl_algorithm.yaml train_full_rl.yaml train_ent01.yaml train_v1_on_path.yaml \
#       --checkpoint outputs/supervised_pg_phased/supervised_pg_phased_latest.pt \
#       --seed 42 --num-updates 30 --run-name v1_onpath_s42
features:
  edge:
    include_on_pending_path: true
