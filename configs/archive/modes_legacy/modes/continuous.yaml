# continuous: 连续会话训练
# 30天连续训练，适合长时间稳定训练
env:
  episode_start_mode: random_day
  day_steps: 1440
  episode_steps: 1000000
  continuous: true
train:
  num_updates: 30
  rollout_steps: 1440
  episodes_per_update: 1
  replay_days: 0
  continuous_session_days: 30
  n_rollout_workers: 1
  rollout_batch: true
  value_target: gae
  ppo:
    epochs: 1
    minibatch_size: 1024
    batch_chunk: 512
    clip_eps: 0.1
    normalize_advantages: true
    entropy_coef: 0.001
    value_coef: 0.5
    max_grad_norm: 0.5
    target_kl: 0.005
  optimizer:
    type: adam
    actor_lr: 0.0001
    critic_lr: 0.0003
  logging:
    log_interval: 1
    checkpoint_interval: 5
    eval_interval: 5
    eval_steps: 1440
    eval_episodes: 2