# 实验：critic 加一路 **max 池化**（min 型瓶颈信息能否被价值网络看见）
# ══════════════════════════════════════════════════════════════════════════
# 一、唯一变量
# ══════════════════════════════════════════════════════════════════════════
#
#   `model.critic.pool_include_max`:  false（默认）→ true
#
# 其余全部不动：策略、encoder、BC 起点、奖励、窗口、线程数。
#
# ══════════════════════════════════════════════════════════════════════════
# 二、为什么是这一条
# ══════════════════════════════════════════════════════════════════════════
#
# 2026-09-21 实测审计（`scripts/diag/probe_const_cols.py`）：
#   `grep "amax|scatter_reduce|max_pool" qkd_rl/rl/models/graph_mappo.py` → **零命中**；
#   `:758/763/767/784` 全是 `.mean(dim=0)`。
#
# 而**本项目的瓶颈是 min 型**：
#   `routing.py:237`  `serve_now = min(hop_levels)`
#   —— 请求吞吐由**最弱那一跳**决定（记忆 `key-pool-is-not-the-bottleneck`）。
#
# ⟹ critic 把 ~90 节点 / 261 物理边**等权平均**成一个全局向量，
#   单个瓶颈跳的贡献被稀释成 **1/N** ⟹ **价值网络看不见瓶颈**。
#
# ★ actor **不池化**（逐边打分）⟹ 受害的主要是 **critic**：
#   优势信号缺了最相关的那一分量。
#
# ══════════════════════════════════════════════════════════════════════════
# 三、代价（已核实，比预期低）
# ══════════════════════════════════════════════════════════════════════════
#
# · 只改 `value_head` 的**输入宽度**：`hidden*3+3` → `hidden*3+3 + hidden*3`
#   = 387 → 771。**不改任何中间维度** ⟹ 不牵动 encoder。
# · **critic 的 value head 本来每次运行就被重置**
#   （`mappo_trainer.py:1691`：`reward config differs from checkpoint:
#    re-initialized critic value head`，因为 reward 段与 checkpoint 不同）
#   ⟹ 本改动**不额外损失任何东西**；**actor 与共享 encoder 的 BC 暖启动保留**。
# · 参数量增量：`(771-387)*128 + ...` ≈ +49k，相对 105 万 +4.7%。
#
# ══════════════════════════════════════════════════════════════════════════
# 四、判据（预注册，先写死；双边，不预判方向）
# ══════════════════════════════════════════════════════════════════════════
#
# 对照臂：`ent01_rerun_s{42..46}`（同配置、同种子、同 8 线程、同节点，u30 已跑完）
# 臂名：  `cmax_s{42..46}`（critic-max）
#
# 窗口 = **u25, u30**（与 `paired_verdict.py` 默认 `--plateau 25,30` 及
#         v1/v2/pm_decode/gae90 的预注册窗口一致）。`verdict-window-is-part-of-the-claim`。
#
# ★★ 族级配对（n=5，df=4，临界 2.776）——**不是逐臂挑**：
#     Δ ≥ +0.020 且 5/5 同向 ⟹ **瓶颈信息对 critic 有用**，写进方法
#     Δ ≤ −0.020 且 5/5 反向 ⟹ 有害，撤回
#     |Δ| < 0.020 ⟹ 测不出 ⟹ 「critic 看不见瓶颈」不是当前的限制因素
#
# ⚠ **逐臂显著不算结论**（记忆 `first-config-to-beat-the-expert`）：
#   本族若方差大，从族里挑最大值必然挑出"显著"——必须用**族级**配对。
#
# ⚠ 惰性证明（**必须**）：`pool_include_max: false` 时，
#   `value_head` 输入宽度与改动前**逐位相同** ⟹ 现有 46 条臂不受影响。
#   由 `probe_cmax_inert.py` 造反证：给新代码喂 false，应与旧代码**逐位相同**。
#
# ⚠ 本文件必须排在 `train_ent01.yaml` **之后**（后覆盖前）。
model:
  critic:
    pool_include_max: true
