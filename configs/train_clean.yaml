# 干净输入：**拿掉专家先验特征**，只留原始可观测量
# ══════════════════════════════════════════════════════════════════════════
# 一、这一版改什么（唯一变量 = 特征集）
# ══════════════════════════════════════════════════════════════════════════
#
#   features.edge.include_relay_importance:  true → false
#   features.edge.include_req_hop:           true → false
#   features.edge.include_on_pending_path:   （基线本就 false；显式写出，防漂移）
#
# 其余**全部不动**：模型结构、奖励、窗口、线程数、超参。
# ★ **起点也保持"从零"** —— 与 `scratch_s*` 族配对，单变量才是特征集。
#
# ══════════════════════════════════════════════════════════════════════════
# 二、为什么这三项是"专家先验"，其余不是
# ══════════════════════════════════════════════════════════════════════════
#
# ★★ `relay_importance` 是**专家打分公式的同一份代码**：
#
#     专家（`greedy_relay_diffusion.py:19`）：
#       from qkd_rl.env.relay_importance import compute_relay_importance
#     RL 特征（`graph_builder.py:13`）：
#       from qkd_rl.env.relay_importance import compute_relay_importance
#
#   专家的分数是（`greedy_relay_diffusion.py:190`）：
#       score = rate_w·rate_norm·(1 + imp_w·relay_importance) + completion + keep − switch
#   **同一个函数**算出的量，一边直接进专家分数，一边当 RL 的输入特征
#   ⟹ 等于把专家"什么重要"的判断**算好了喂给模型**。
#
# ★ `req_hop`：物理边两端点到最近 pending 请求源/宿端点的 hop 数（4 列）。
#   这是**替模型完成"哪条边在需求通路上"的推理**。
#
# ★ `on_pending_path`（v1/v2）：直接标出 `argmin(hop_levels)` 的瓶颈跳。
#   这是**替模型算出"哪条边卡住这条请求"**。基线未开，此处显式关死。
#
# ⟹ 本项目已两次"加这样的列"，两次都测不出（v1 Δ+0.0154 t=1.72；
#   v2 Δ+0.0080 t=0.89，见 `docs/训练诊断记录.md`）。
#   **本臂反向走**：把它们拿掉，看模型能不能自己拟合出来。
#
# ══════════════════════════════════════════════════════════════════════════
# 三、**保留**哪些（以及为什么保留）
# ══════════════════════════════════════════════════════════════════════════
#
# 保留的是**原始可观测量**，不是设计者对"什么重要"的判断：
#   · 当前速率 / 当前可用性 / 未来 6 步窗口（环境提供的信息，非公式）
#   · QKP 存量 / 剩余容量（原始状态）
#   · 需求侧：pending 量 / 计数 / deadline / 等待桶（原始需求）
#   · `last_activated`（策略**自己**上一步的动作，不是专家先验）
#   · 节点类型 / 时间特征 / 拓扑
#
# ⚠ 一次只动"替模型推理"的三项，**不动"信息量"**（窗口/速率统计）。
#   若本臂测出为正，下一臂再单独扫"未来窗口算不算先验"。
#
# ══════════════════════════════════════════════════════════════════════════
# 四、代价与前提（已核实）
# ══════════════════════════════════════════════════════════════════════════
#
# · 关掉这几列会让 `edge_dim` **变小**（44→44−1−4=39），
#   `encoder.edge_proj_*` 的末维随之变窄。
# · ⚠ **变窄无法靠补零救回**（`_upgrade_state_dict_for_model` 只能救变宽的）
#   ⟹ **必须从零训**，不能带 BC 起点。这也正是本臂的设计：与 `scratch_*` 配对。
#
# ══════════════════════════════════════════════════════════════════════════
# 五、判据（预注册，先写死；双边）
# ══════════════════════════════════════════════════════════════════════════
#
# 对照臂：`scratch_s{42..46}`（**从零训 + 全特征**，u30 已跑完）
# 臂名：  `clean_s{42..46}`
# 唯一变量：上面三项特征
#
# 窗口 = **u25, u30**（与 v1/v2/pm_decode/gae90/cmax 一致）。
# ★★ **族级**配对（n=5，df=4，临界 2.776）——**不是逐臂挑**
#    （`first-config-to-beat-the-expert` 的教训）。
#
#   Δ ≥ +0.020 且 5/5 同向 ⟹ **专家先验特征一直在压制模型**（论文核心贡献）
#   Δ ≤ −0.020 且 5/5 反向 ⟹ 那些先验是**必要的**，模型自己学不出来
#   |Δ| < 0.020 ⟹ 测不出 ⟹ 先验特征不是影响因素
#
# ⚠ 从零训的族内方差**很大**（`scratch` 族 SD=0.088，是 BC 族 0.009 的 10 倍）
#   ⟹ n=5 下这对族级配对的**分辨率差**。若测不出，先看是不是被方差吃掉，
#   必要时补种子（`clean_s47..50`）。
#
# ⚠ 本文件必须排在 `train_ent01.yaml` **之后**（后覆盖前）。
features:
  edge:
    include_relay_importance: false
    include_req_hop: false
    include_on_pending_path: false
