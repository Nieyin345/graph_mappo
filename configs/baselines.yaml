baselines:
  random:
    enabled: true
  greedy_rate:
    enabled: true
    use_future_mean_rate: false
  greedy_qkp:
    enabled: true
    low_inventory_weight: 0.0
    rate_weight: 0.2
  greedy_demand:
    enabled: true
    rate_weight: 0.2

  # Combined greedy matching: global edge matching with a tunable mix of
  # rate (key generation), QKP inventory, pending demand, and switch-cost
  # avoidance. All per-step signals are normalized to [0, 1].
  # Demand-aware relay greedy: scores edges by the pending demand whose 2-hop
  # relay path uses them, with a completion bonus for finishing a half-stocked
  # path. Plain per-link greedy matches generated keys that requests never use
  # (paths never form), so this policy is the strong heuristic baseline.
  greedy_relay:
    enabled: true
    rate_weight: 1.0
    demand_weight: 2.0
    completion_multiplier: 3.0
    keep_weight: 0.5
    deadline_window: 60.0

  # V3: current BFS baseline. Uses the shared dynamic relay importance that
  # includes stocked-but-unavailable edges, with the tuned importance weight.
  greedy_relay_diffusion_v3:
    enabled: true
    rate_weight: 1.0
    importance_weight: 10.0
    completion_weight: 1.0
    keep_weight: 0.5
    switch_weight: 0.2
    hop_decay_factor: 0.25
    max_path_links: 3
    wait_urgency_tau_ratio: 0.8
    ignore_consumption: false
    include_stocked_unavailable: true

  greedy_matching:
    enabled: true
    rate_weight: 1.0
    level_weight: 0.5
    demand_weight: 1.0
    keep_weight: 0.5

  ilp_optimal:
    enabled: true
    slot_seconds: 60.0
    # Matches env.switch_cost.rate_decay_factor: links activated this slot but
    # not in the previous slot generate at this fraction of their rate.
    switch_decay: 0.5
    max_requests: 64
    max_paths_per_request: 8
    max_path_hops: 6
    time_limit_s: 5.0
    mip_rel_gap: 0.0
    # Stage-2 objective bonus: after maximising this-slot service, prefer
    # generating keys on dynamic relay-importance paths so the MILP also
    # stocks future demand instead of only chasing immediate service.
    importance_weight: 2.0
    max_path_links: 3
    hop_decay_factor: 0.25
    wait_urgency_tau_ratio: 0.8
    ignore_consumption: false
    # Allow the stage-2 stocking objective to sacrifice up to this fraction
    # of the stage-1 optimal service, so future relay paths can be stocked.
    service_slack_ratio: 0.1
