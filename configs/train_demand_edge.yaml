# Demand -> physical-edge mode: keep the old mixed GNN available, and use
# bidirectional shortest-hop relay pressure (up to max_path_links links) as
# the main actor signal. Deep-merged LAST so it overrides the default
# graph_mappo.yaml model mode.
model:
  mode: demand_edge

features:
  demand_edge:
    wait_bucket_count: 10
    # 0 = no time decay; positive tau = exp(-wait_time / tau).
    wait_decay_tau: 0
  edge:
    include_relay_importance: true
    relay_importance:
      max_path_links: 3
      hop_decay_factor: 0.25
      availability_sample_stride: 600
      availability_sample_limit: 876
      capacity_decay_strength: 1.0
      min_scarcity: 0.0
