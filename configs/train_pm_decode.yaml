# B′：协调的**解码方式** —— `mutual_choice` → `priority_matching`
# ══════════════════════════════════════════════════════════════════════════
# 一、这一版改了什么（**唯一一个点**）
# ══════════════════════════════════════════════════════════════════════════
#
#   `action_resolver.mode`:  `mutual_choice`  →  `priority_matching`
#
# 别的**全部不动**：策略、模型结构、BC 起点、Adam 动量、奖励段、窗口、线程数。
# 见 §四的机器判据（逐字段比对 `build_config()` 的产物，差异集合必须恰好是
# `{action_resolver.mode}`）。
#
# ══════════════════════════════════════════════════════════════════════════
# 二、为什么这不是"再找一个旋钮"，而是一条**机制**问题
# ══════════════════════════════════════════════════════════════════════════
#
# 现状 `mutual_choice`（`action_resolver.py:130-151`）= **纯双端握手**：
#   `u->v` 生效 **iff** `u` 的 Tx 指向 `v` **且** `v` 的 Rx 接受 `u`。
#
# ⟹ 专家的优势里有一部分**不是学出来的**：`PathScoreGreedy` 写
#   `dual[a][0]=b` **且** `dual[b][1]=a`（`:186` 附近，构造上就镜像），
#   所以它**天然满足**双端条件；而 RL 策略对每个节点**独立采样**，
#   两端要自发撞上同一个选择。**「协调」在 `mutual_choice` 下不是被优化的量，
#   是一条冻结的规则**（`docs/定稿结论.md` §3.2「推翻之一」）。
#
# `priority_matching`（`action_resolver.py:154-184`）换掉的是**解码**这一步：
#   1. 从策略提交的 `(tx, rx)` 里收集候选弧
#   2. 按 `edge_scores`（**策略自己给的分数**）打分
#   3. `_sort_candidates` 排序 → `_greedy_match` 用 `used_tx`/`used_rx`/`used_pair`
#      三条约束贪心去冲突
# ⟹ 它**仍然消费策略的偏好**（读 `edge_scores`），只是把"两端必须互选"
#   换成"按分数确定性地分配端口"。
#
# **这才是「协调是必需的还是可被解码替代的」这个问题的干净对照**：
# 唯一变量是解码器，不牵动模型、不牵动 BC 起点、Adam 不丢
# （结构没变 ⟹ 不触发 `mappo_trainer.py:1439-1441` 的 critic 重置）。
#
# ⚠ 它**不是** H₁ 点名的「单智能体 DRL」对照 —— 那需要重写 actor（方案 C），
#   成本已勘察（`core/config.py:166-167` 硬拒 `model.name != graph_mappo`、
#   5 处硬编码构造点、log-prob 口径一换就要重标定 `clip_eps`/`target_kl`）。
#   本臂给的是**解码器消融**，是消融节的一条，不是 H₁ 的主对照。
#
# ══════════════════════════════════════════════════════════════════════════
# 三、代码前提（**今天已修并实测**，不是"没跑过的路径"）
# ══════════════════════════════════════════════════════════════════════════
#
# 此前 `priority_matching` **第 1 步就崩**：策略用顺序 Gumbel 采样
# （`policy.py:107`），resolver 用确定性贪心（`action_resolver.py:319`），
# 而 7 处调用点在 `priority_matching` 下仍把 `step.matched_edges` 当
# `expected_matched_edges` 传进 `env.py:169` 的自洽校验 ⟹ `RuntimeError`。
#
# 修法（commit `f3f9c79`）：把 `priority_matching` **并进 `max_weight_matching`
# 那条已经跑通的分支** —— 取**执行后**的 `env.last_matched_arcs`
# 并用 `log_prob_entropy_for_matching` 重算。两处同改，且常量化成
# `DETERMINISTIC_RESOLVER_MODES`（`policy.py:54`）以防再次漂移。
#
# 实测（`probe_pm_repro.py` + `verify_pm_fix.py`，服务器上）：
#   | mode | 修前 | 修后 | 采样≠执行 | 重算自洽 |
#   | `mutual_choice`     | 通过 20/20 | —         | 0%   | —        |
#   | `priority_matching` | **0/20（第1步崩）** | 20/20 | 100% | 0.0e+00 |
#   | `max_weight_matching` | 通过 15/15 | 15/15   | 100% | 0.0e+00 |
#
# 惰性（已核实）：全库 245 个 run 的 `resolved_config` **全部 `mutual_choice`**
# ⟹ 本改动不可能影响任何既有读数，**不需要作废任何配对**。
#
# ══════════════════════════════════════════════════════════════════════════
# 四、预注册判据（**先写死**；双边，我不预判方向）
# ══════════════════════════════════════════════════════════════════════════
#
# 对照臂：`v2_bottleneck_s{42,43,44,45,46}` —— **同一个 BC 起点、同种子、
#         同 8 线程、u30 已跑完**（实测每个 metrics.jsonl 36 行 / 30 个 update）。
# 臂名：  `pm_decode_s{42,43,44,45,46}`
# 唯一变量：`action_resolver.mode`（见 §五的机器判据）
#
# 主窗口 = **u25, u30**（与 `paired_verdict.py` 默认 `--plateau 25,30` 一致，
#          也与 v1/v2/gae90 的预注册窗口一致）。`verdict-window-is-part-of-the-claim`。
# 主判据：同训练种子配对，n=5，df=4，临界 **2.776**
#
#   ① Δ ≤ **−0.020** 且 **5/5 同向** ⟹ **互选协议是有贡献的**
#      即"两端必须互选"这条约束挡住了更差的分配 ⟹ 论文把互选写成方法的一部分
#   ② Δ ≥ **+0.020** 且 **5/5 同向** ⟹ **互选是瓶颈**
#      ⟹ 论文主张从「学协调」改成「学打分 + 确定性解码」
#   ③ |Δ| < **0.020** ⟹ 测不出 ⟹ 「解码器不是瓶颈」，与 §1.1 的
#      「RL ≈ 专家、方向略负」一致，转去写 §4 的消融表
#
# 副判据：**逐轮 Δ 全轨迹 u1→u30**（不带窗口）。看**结构**：
#         "整体下移"与"早负晚正交叉"含义完全不同 —— gae90 那次只在 u25/u30
#         过线、早期显著为负，所以只能写"交叉"不能写"提升"。
#
# ⚠ 配对不是可选（`docs/测试规范.md` §4）：逐种子成功率跨 0.29–0.88，
#   不配对时 15 种子 SE≈0.062，配对后 ≈0.012。0.02 的差距必须配对才测得出。
# ⚠ 独立性限制：五条臂与五条对照都从**同一个 BC checkpoint** 长出来、共享早段
#   路径 ⟹ 配对差 d_s 在种子间**不完全独立**。结论只能写「在该共同起点下的
#   这 5 个种子上」，**不能**写"独立复现"。
# ⚠ **u1 指纹必须变**（rollout 换了），这是**正确且预期**的，不是故障
#   （`docs/定稿结论.md` §3.3-e）。但它**必须被记录**，作为"部署确实生效"的证明。
#
# ══════════════════════════════════════════════════════════════════════════
# 五、机器判据：唯一变量必须**由 `build_config()` 自证**
# ══════════════════════════════════════════════════════════════════════════
#
# 不读 yaml 猜。启动器（`scripts/diag/archive/2026-09/wave_pm.py` 的预检）直接调训练的
# `build_config()` 逐字段比对两条链：
#
#   对照 = rl_algorithm.yaml train_full_rl.yaml train_ent01.yaml train_v2_bottleneck.yaml
#   臂   = 上面 + train_pm_decode.yaml
#
# 差异集合**必须恰好等于** `{"action_resolver.mode"}`；否则一条都不起。
#
# 用法（服务器上）：
#   python scripts/train/train_graph_mappo.py \
#       --configs rl_algorithm.yaml train_full_rl.yaml train_ent01.yaml \
#                 train_v2_bottleneck.yaml train_pm_decode.yaml \
#       --checkpoint outputs/supervised_pg_phased/supervised_pg_phased_latest.pt \
#       --seed 42 --num-updates 30 --run-name pm_decode_s42
#
# ⚠ 本文件必须排在**最后**（后覆盖前）。
action_resolver:
  mode: priority_matching
