# Full training-window run: the validated algorithm (rl_algorithm.yaml) applied
# over `global.yaml`'s real training window (days 0-295, random day start) with
# varying requests, instead of the single fixed diagnostic scenario.
#
#   python scripts/train/train_graph_mappo.py \
#       --configs rl_algorithm.yaml train_full_rl.yaml \
#       --checkpoint outputs/supervised_pg_phased/supervised_pg_phased_latest.pt \
#       --run-name full_rl --num-updates 30
#
# Held-out evaluation uses the validation window (days 330-365, 240 steps) on
# 15 request seeds instead of global.yaml's 5, and on seeds DISJOINT from the
# training range (training uses env_seed + 8*update + i = 7, 15, 23, ...).
#
# Why 15: a 5-seed mean has SEM ~0.03, so any arm-to-arm difference below three
# points is invisible; 15 seeds halves that. Why disjoint: with the default
# validation seeds 7-11 the training and validation seed ranges overlapped
# numerically (no actual leak -- the validation days 330-365 are outside the
# training window, and the same seed at a different start slot produces a
# different stream -- but it is luck, not design).
validation:
  window:
    start_day: 330
    end_day: 365
  start_mode: random_day
  episode_steps: 240
  episodes: 15
  request_seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114]
env:
  episode_start_mode: random_day
  # -1 = let episode_start_mode pick the start; the diagnostic preset pins 0.
  episode_start_day: -1
  episode_steps: 1440
  continuous: false
  # The training window is derived from global.yaml by train_graph_mappo.py;
  # these are the values it would set, written out so this file is also correct
  # when loaded directly by another script.
  activation_window_start_day: 0
  activation_window_end_day: 295
  activation_window_days: 295
scenario:
  time_limit:
    days: 296
train:
  num_updates: 30
  rollout_steps: 1440
  # Varied start days are the point of this arm.
  fixed_episode_seed: false
  logging:
    log_interval: 1
    checkpoint_interval: 5
    eval_interval: 5
