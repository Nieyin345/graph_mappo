# ============================================================================
# 筛选臂（显式覆盖，非模型定义）：v3 的 actor_lr 低侧对照 1e-5
#
# 为什么需要这个臂：全局默认 actor_lr = 3e-5 是**唯一没有实测依据**的参数。
# 历史上那次 lr 扫描（0.0001 / 0.0003 / 0.003 / 0.001）跑在 **entropy_coef=0.001
# + 诊断场景**上，而这两条都已被推翻 —— ent 0.001 是已知坏值，诊断场景的排名
# 明确记录「不能用来定哪个配置更好」（docs/训练诊断记录.md 结果 B 第 2 条）。
# 所以 3e-5 好不好，**必须在本 regime 内重新测**。
#
# 三点 log 等距：1e-5 / 3e-5 / 1e-4（比值 3 / 3.33）
#   · 本文件            → 1e-5（低侧）
#   · experiment_base   → 3e-5（默认，也是本臂的对照）
#   · screen_lr1e4.yaml → 1e-4（高侧）
# 两个臂都跑 3 个种子（42/43/44）—— 项目硬规矩：比较训练配置要 ≥3 训练种子，
# 单种子分辨率只有 ~0.035，1 个种子测不出任何东西。
#
# ★ 本臂**不动任何张量形状** ⟹ 与 v3 默认臂共用同一份 BC 起点
#   （BC 不读 actor_lr，已实测）。
#
# 用法（统一入口，--config 排在 experiment_base 之后所以生效）：
#   scripts/experiment.py train --model v3 --seed 42 --name scr240_v3_lr1e5_s42 \
#       --updates 20 --config screen_lr1e5.yaml \
#       --resume outputs/experiments/v3/screen_bc/bc/supervised_pg_phased.pt
# ============================================================================
train:
  optimizer:
    actor_lr: 0.00001
