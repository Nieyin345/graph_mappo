model:
  name: graph_mappo
  # mixed: physical edges and demand edges both participate in the shared
  # node/edge GNN; demand pressure diffuses along physical links so edge
  # scoring carries path context (required for path-aware matching).
  # demand_edge: physical edges do not update nodes (kept for ablation).
  mode: mixed
  encoder:
    gnn_type: graphsage
    node_dim: auto
    edge_dim: auto
    hidden_dim: 128
    num_layers: 3
    activation: relu
    dropout: 0.0
    layer_norm: true
    residual: true
    share_actor_critic_encoder: true
  actor:
    share_actor_across_node_types: true
    edge_scorer_hidden_dims: [128, 128]
    idle_scorer_hidden_dims: [128]
    temperature: 1.0
    # Opt-in per-arc demand-conditioned residual on the edge score:
    #   s_a = edge_scorer(pair_emb_a) + DemandResidual(pair_emb_a, demand_emb)
    # The residual's last layer is zero-initialised, so `enabled: false`
    # (default) and `enabled: true` are bit-identical at the first forward.
    demand_residual:
      enabled: false
      num_heads: 4
  critic:
    pooling: typed_mean
    hidden_dims: [128, 128]
  distribution:
    type: masked_categorical
    invalid_logit_value: -1000000000.0

