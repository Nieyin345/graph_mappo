# ============================================================================
# v4 归因分解臂：需求融合关断（fuse_demand_to_node = false）
#
# 单变量：只关掉 GNN 里需求边到节点的融合，其余同 v3 默认。
# 动机与判据见 diag_v4_iso.yaml 头部注释（同一波实验）。
#
# ⚠ 改了 model 段 ⟹ tensor 形状可能变 ⟹ **BC 必须重跑**，
#    且若形状变，BC 权重无法从别的臂迁移（本臂从零 BC）。
# ============================================================================
model:
  encoder:
    fuse_demand_to_node: false
