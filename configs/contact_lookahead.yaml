# Deterministic contact-plan lookahead.
#
# In causal v7 experiments this feature MUST use only the pure-geometry H5
# 'los' surface (LOS + elevation/grazing/distance gates), never future
# weather-driven k_proxy or realized cloud state.  The provider enforces this
# when features.edge.information_mode: causal.
#
# The feature adds buckets+2 columns per physical edge:
#   - visible fraction in each future geometry bucket;
#   - remaining duration of the current/next geometric contact;
#   - gap to the following geometric contact.
# Enabling it changes the physical-edge input dimension and therefore requires
# a model/checkpoint built for that dimension.
features:
  edge:
    contact_lookahead:
      enabled: true
      steps: 120
      buckets: 8
