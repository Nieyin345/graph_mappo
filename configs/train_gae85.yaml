# 旋钮：`gae_lambda` 0.95 → 0.85（**已验证方向的剂量递进**）
#
# ## 为什么是这一格（不是新方向，是上一步的直接延伸）
#
# `gae90`（λ=0.90）是本项目**第一个、也是唯一一个通过预注册判据的方向**：
#   n=5 训练种子 × 15 请求种子配对，Δ=+0.0146、SD=0.0090、SE=0.0040、
#   **t=+3.61**、df=4 临界值 2.776 ⟹ **过线**；逐种子 5/5 同向
#   （`+0.0128 +0.0302 +0.0071 +0.0110 +0.0117`）。
#
# 而反方向（**更**依赖 bootstrap）已在**两个独立实例**上一致有害：
#   · γ=0.999（单种子，−0.0284）
#   · λ=0.99（预注册 3 臂，早期 t=−52.6、平台 t=−1.78）
#   —— 见记忆 `gamma-does-not-stack-on-entropy`。
#
# ⟹ 现有读数只覆盖「λ ≥ 0.95」这一侧。「λ 继续往下」是**空白**，
#    而 λ=0.90 已经指向「降是对的」。本臂就是问：**还能不能更低。**
#
# ## ★ 剂量-反应：两个方向都有信息量（这才是本臂的真正价值）
#
#   · 若 `gae85` 再涨（Δ(0.85 vs 0.90) > 0）⟹ **单调**，λ 是一条可榨的轴，
#     下一步直接测 λ=0.80 并做线性外推求最优点；
#   · 若 `gae85` 与 0.90 持平（|Δ| < 分辨率）⟹ **0.90 附近是平台**，
#     这条轴到此为止，可以把它**锁进取值**不再动；
#   · 若 `gae85` 回落 ⟹ 存在**内部最优点**，0.90 附近就是它，
#     同样是可采纳的结论（把 0.95 改成 0.90 并停止搜索）。
#
# **三种结果都直接可行动**，这是它比"再找一个新旋钮"更值的地方
# （回顾：`holdout_warmstart`、`batch_chunk`、`lr` 退火三条新旋钮线索，
#   已被各自的实测逐条否掉 —— 见 `docs/训练诊断记录.md`）。
#
# ## 机理（与 gae90 同一条，只是更远）
#
# λ 控制优势估计里 bootstrap 的衰减长度。λ 小 ⟹ 优势更多来自**实际回报**、
# 更少来自 **critic 的猜测** ⟹ 对 critic 误差更鲁棒，代价是**方差更大**。
# 本项目的病理恰恰是「critic 拟合得太好 ⟹ advantage 塌缩到 0.37 ⟹
# actor 梯度弱」（记忆 `actor-is-frozen-by-advantage-collapse`）⟹
# **方差那一侧正是缺的**。λ 往 0.85 去就是继续往这个方向加方差。
#
# ⚠ 反方（必须先写下来，防事后编故事）：λ↓ 也把**有效视界**缩短，
#    长程信用分配变弱。0.90 已验证有益，但 0.85 可能已经越过最优点。
#    **这正是本臂要判的东西**，不是本臂的缺陷。
#
# ## 只改 `train.gae_lambda`，不动 `gamma`
# γ 单独测过（0.999）且有害；同时动两个会混淆。
#
# ## 用法（★ 必须排在 train_ent01.yaml **之后**）
#
#   OMP_NUM_THREADS=8 MKL_NUM_THREADS=8 /opt/qkd/venv/bin/python -u \
#       scripts/train/train_graph_mappo.py \
#       --configs rl_algorithm.yaml train_full_rl.yaml train_ent01.yaml \
#                 train_gae85.yaml \
#       --checkpoint outputs/supervised_pg_phased/supervised_pg_phased_latest.pt \
#       --seed 42 --num-updates 30 --run-name gae85_s42
#
# ### 判据（跑之前写死）
#
# **对照二选一，都必须先过 u1 指纹**：
#   · 主对照（配对最优）= `gae90_s{42,43,44}`：同节点、8 线程、**同种子**，
#     唯一差别就是 λ 0.90 vs 0.85。**主判据用这个**（臂 vs 臂）。
#   · 次对照 = `ent01_rerun_s{42,43,44}`：λ 0.95 的原点，用来把
#     `gae85 → gae90 → ent01` 三点连成**剂量-反应曲线**。
#
# n=3，df=2，**临界值 4.303**（不是 2）。主窗口 = 平台 u25/u30，逐种子配对。
# ★ 本项目踩过「换个窗口结论翻转」的坑（记忆 `platform-window-masks-early-effect`）
#   ⟹ 报告义务：除平台值外**必须给逐轮曲线与逐轮跨种子 SD**。
#
# 起臂自检（免费且决定性）：u1 的 rollout 发生在第一次梯度更新**之前**，
# 只由「权重+种子+线程+代码+硬件」定，与本臂超参无关 ⟹ 三个种子的 u1
# `mean_success_rate` 必须与对照**逐位相同**：
#   42 → 0.8725097087  43 → 0.8740972488  44 → 0.8710084918
# （这三个数与 `gae90` 臂的 u1 指纹一致 —— gae90 的 n=5 自检 5/5 逐位相同。）
# 对不上就说明中间有未记账的变量，先停下查。
#
# ⚠ λ 是**纯 GAE 计算**参数，**不碰环境、不碰奖励、不碰播种** ⟹
#   u1 指纹必须在**两侧**都逐位相同，这是真正的"免费造反证"。
train:
  gae_lambda: 0.85
