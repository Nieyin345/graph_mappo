# 旋钮 A 的**剂量-反应**检验：`value_coef` 0.5（基线）/ 0.75（本臂）/ 1.0（已有）
#
# ### 为什么是这一臂（而不是"再跑一遍 vcoef1"）
#
# 重标定后，9 个臂里**只有 `vcoef1` 的配对差是紧的**：
#
#   | 臂 | Δ(u25/u30 配对) | 跨种子 SD | 3/3 同向? |
#   |---|---|---|---|
#   | **vcoef1** | **+0.0066** | **0.0045** | 是 |
#   | ent03 / w329p | +0.0066 / +0.0029 | 0.0189 / 0.0209 | 否 |
#   | 其余六臂 | −0.005 ~ −0.057 | 0.013 ~ 0.063 | 否 |
#
# 也就是说：**唯一还活着的候选就是它**，且它同时是"唯一紧的"。
#
# ⚠ 但"唯一紧的"这件事**本身可疑**：在 9 个候选里挑出方差最小的那个，是
# 教科书式的选择偏差（见 记忆库 selection-bias-max-of-k）。所以**不能直接采信**。
# 免费的判别式有两个，本臂用的是第二个：
#
#   1. **换种子复现**（要同时重跑 3 个新种子的对照，成本 ×2）
#   2. **剂量-反应**（本臂）：若 +0.0066 是真效应，0.75 处应约为一半（~+0.003），
#      且 SD 仍紧；若是噪声，0.75 处会随机落在任意值且 SD 回到 0.015~0.02。
#
# 剂量-反应比"再跑一遍同样配置"**证据强**：同样的成本能排除"这个点碰巧好"，
# 而重复只能说明"可重复"（同一伪影也可重复）。
#
# ### 机理与预期（跑之前写死，防事后编故事）
#
# `value_coef` 是 critic 损失在总损失里的权重（基线 0.5）。提高它 ⟹ critic 拟合更稳
# ⟹ 优势估计噪声变小 ⟹ actor 更新方向更一致。**若这条机制成立，效应应对
# value_coef 单调**，且中途不该出现符号翻转。
#
# 预注册的三种结果：
#   R1 单调（0.75 约 +0.003、1.0 约 +0.006，SD 均 < 0.008）⟹ **采纳方向**，
#      下一波再去确认更大值（2.0）与更多种子。
#   R2 平（0.75 与 1.0 都是 +0.006）⟹ 不是剂量-反应，更像某个离散的"开/关"，
#      或选择偏差。**不采纳**，转去做结构改动。
#   R3 无（0.75 落在 −0.01~+0.01 且 SD 回到 0.02）⟹ `vcoef1` 的紧是选择偏差。
#      **结案**：本视角下没有可采纳的旋钮，转结构。
#
# 三种结果都能推进——这是选它的主要理由。
#
# ### 风险
#
# `value_coef` 过大会让 critic 主导梯度。0.75 比 1.0 **更靠近基线**，所以本臂的
# 风险低于已经跑完的 vcoef1。读数时看 `value_return_corr` 有没有塌。
#
# ### 成本与破坏面
#
# · 不动任何张量形状 ⟹ **不需要 BC 起点迁移**。
# · 1 维扫描、3 臂、30 轮、8 线程、约 50 分钟。
#
# 用法（★ 必须排在 train_ent01.yaml **之后**）：
#
#   OMP_NUM_THREADS=8 MKL_NUM_THREADS=8 /opt/qkd/venv/bin/python -u \
#       scripts/train/train_graph_mappo.py \
#       --configs rl_algorithm.yaml train_full_rl.yaml train_ent01.yaml \
#                 train_safe_vcoef075.yaml \
#       --checkpoint outputs/supervised_pg_phased/supervised_pg_phased_latest.pt \
#       --seed 42 --num-updates 30 --run-name vcoef075_s42
#
# ### 判据（跑之前写死）
#
# 对照 `ent01_rerun_s{42,43,44}` —— **本节点、8 线程、同配置重跑**。
# `ent01_t8_*` 是跨节点搬来的，含 ~0.0197 硬件偏置，**禁止用作对照**
# （见 docs/训练诊断记录.md「★★★ 重标定终判」）。
# n=3，df=2，**临界值 4.303**（不是 2）。主窗口 = 平台 u25/u30，逐种子配对。
#
# 起臂自检：u1 `mean_success_rate` 必须与对照**逐位相同**
# （42→0.872510, 43→0.874097, 44→0.871008）。对不上就停下查，别跑完再说。
train:
  ppo:
    value_coef: 0.75
