# entropy_coef 回到 0.001（默认值），用作 u25→u30 的**起点配对对照**

## 为什么现在要做这个（此前没做，是个缺口）

ent01 三条臂的 u25 曲线几乎重合：

| run | u5 | u10 | u15 | u20 | u25 |
|---|---|---|---|---|---|
| ent01_s42 | 0.6896 | 0.7033 | 0.6930 | 0.6651 | 0.7077 |
| ent01_s43 | 0.6886 | 0.6925 | 0.7048 | 0.7207 | **0.7221** |
| ent01_s44 | 0.6801 | 0.7050 | 0.7101 | 0.7173 | 0.7216 |

对专家（同种子 100-114 配对，专家 0.6979）：
u25 三种子 **+0.0098 (t 0.94) / +0.0242 (t 3.72) / +0.0237 (t 3.72)**。

**但这三条都是 ent=0.01**，而历史上跑过 ≥25 轮的对照臂 **ent 全是 0.01**
（r7_fix_ent、r8_ent01_s42）。于是"u25 超专家"到底归因于
**entropy_coef=0.01**，还是**只是训练得更久**——**当前数据无法区分**。

更麻烦的是：ent01 的预注册判据（u15 三种子均值 ≥ r8_base 的 0.6893+0.035）
用的是与 **r8_base 的跨 run 比较**，而 r8_base 只跑到 u15。u15 时三种子均值
0.7026 vs 0.6893 = **+0.0133**；到 u25 变成 0.7171 vs 0.6893 = **+0.0278**
——"未达标"这个判决**依赖于读取的轮次**。要结束这种含糊，需要一个**同起点**的对照。

## 怎么做到"严格同起点"

从 `outputs/ent01_s42/checkpoint_update_000025.pt` 恢复，只把 entropy_coef
改回 0.001，其余全部不动、**同一个种子 42**。

这样配对成立，因为：

1. `mappo_trainer.py:297` / `:387`：`base_seed = env_seed + update_count * stride`。
   `update_count` 从 checkpoint 恢复为 25（`checkpoint.py` 存了 `update`，
   `mappo_trainer.py:1204` 恢复它），`env_seed` 由 `--seed 42` 给定，
   所以 u26–u30 的**请求流与 ent01_s42 完全相同**，逐种子配对有意义。
2. `load_checkpoint` 只恢复 model/optimizer 状态与 update counter，
   **保留当前运行配置**（`mappo_trainer.py:1205-1210` 明确注释了这一点），
   所以本文件的 `entropy_coef: 0.001` 不会被 checkpoint 里的 0.01 盖掉。
   （已逐字核对过这个分支，不是假设。）
3. entropy_coef 只出现在 `train.ppo` 里，不影响环境、奖励或播种。

于是 `ent01_s42_u25_base` vs `ent01_s42` 的差 = **u25 之后 entropy_coef 的净效应**，
起点完全相同，不需要三个种子——**但结论仍按单种子口径解读**（§4⑦ 分辨率 ~0.035，
下面 u26–u30 只有 5 个点）。

## 这个实验**不能**回答什么

- **不能**回答"ent01 从 u1 就开始是否更好"——起点已经是 u25 的 ent01 权重，
  早期差异被当作既定条件。
- **不能**给出"训练更久能否超专家"的因果答案——两条臂都从 u25 起跑，
  要看的是**它们之间的差**，不是各自对专家的差。
- 单种子。u26–u30 只有 5 个验证点。若两组在这 5 点上差异 <0.035，**不算结论**。

若本对照与 ent01_s42 在 u26–u30 上**无差异**，则正确结论是
"entropy 的效应在 u25 之后已饱和/消失，两条臂等价"——而不是"ent01 更好"。

## 用法

排在 train_ent01.yaml **之后**（后覆盖前），把它把 entropy_coef 改回 0.001：

```bash
python scripts/train/train_graph_mappo.py \
    --configs rl_algorithm.yaml train_full_rl.yaml \
               train_ent01.yaml train_ent01_off.yaml \
    --checkpoint outputs/ent01_s42/checkpoint_update_000025.pt \
    --seed 42 --num-updates 5 --run-name ent01_s42_u25_base
```
（`--num-updates 5` 会覆盖 train.num_updates；trainer 从 update_count=25 起，
跑到 u30，`30 % eval_interval(5) == 0` 触发验证。）
