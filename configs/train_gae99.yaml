# gae_lambda 扫描：0.95（现行，**从未扫过**）vs 0.99
#
# ### ★★ 结论已**重标定**（2026-09-19 终判，推翻下面那版旧结论）
#
# **旧结论作废的原因**：它拿 `ent01_t8_s{42,43,44}` 当对照，而那三个臂是
# **从旧节点 amd238（EPYC 7402P，Zen 2）搬过来的**，不是本节点跑的。
# 同一配置同一种子在两个节点上，u1 rollout 就差 0.0148；平台窗口的硬件偏置
# 实测 **−0.0197**，且偏置在 u5/u10 最大（−0.0182 / −0.0234）。
# 详见 `docs/训练诊断记录.md`「★★★ 重标定终判」节 与
# 记忆库 `arms-must-not-be-carried-across-nodes`。
#
# **用本节点干净对照 `ent01_rerun_s{42,43,44}` 重算后**：
#
# · 平台窗口：Δ = **−0.0572**，SD 0.0631，**t = −1.57** ⟹ 测不出。
# · 所谓「早期紧的一致下移」**也基本是那个硬件偏置**：
#     u5  −0.0285 (t=−12.09)  →  −0.0102 (t=−1.90)
#     u10 −0.0366 (t=−42.98)  →  −0.0131 (t=−2.94)
#   算术闭合：−0.0366 − (−0.0234) = −0.0131。
#   **「跨种子 SD 小」推不出「来源是配置」**——跨节点固定偏置在数据上完全同形。
#
# **修正后的状态**：λ=0.99 方向**证据变弱但未消失**（逐轮 Δ 从 u5 的 −0.010
# 单调放大到 u30 的 −0.059，量级单调本身就是结构）。仍**不采纳**，但理由是
# 「未测出 + 方向一致」而不是旧文里的「|t|>14 铁证」。
#
# ★ 另一个免费的、先于重标定就存在的证据：`gae99`（改 λ）与 `alr1e3`（改
#   actor_lr）**机理完全不同**（优势方差×3 vs kl×2.1），却给出同一个签名
#   「u5 紧、一致负、后期散开」⟹ **签名在共同项（对照臂）上，不在旋钮上**。
#
# **本文件不要再跑**（若再跑 λ 方向，跑 `train_gae90.yaml`——那是从未测过的一侧）。
#
# ### 旧结论（保留作记录，**已被上面推翻，勿引用**）
#
# · 预注册判据：Δ = −0.0769，t = −1.784（df=2，临界 4.303）⟹ 测不出。
# · 逐轮曲线"早期紧、一致的下移"（u5 Δ=−0.0285 SD=0.0033；u10 Δ=−0.0366
#   SD=0.0012），u15 起散开。**这条现已被判定为硬件偏置，不是配置效应。**
# · 机理（这部分未受影响，仍是实测）：λ↑ 让 `mean_abs_advantage` 涨 3.0×、
#   `critic_loss` 涨 5.2×、熵平台 4.47 vs 4.24 ⟹ **改的是方差不是信号**。
#
# ### 为什么选它 —— 理由只是「唯一没查过的」，不是「它有戏」
#
# `check_knob_coverage.py` 报过几个「从未扫过」的旋钮。前两个已被**实测划掉**：
#   · `max_grad_norm`：裁剪 0/30 轮触发、中位范数只有阈值的 0.44 倍 ⟹ 闸门没在工作
#   · `clip_eps`：ratio ≈ 1.0005 ⟹ 0.1 的界永远够不着
# 只剩 `gae_lambda` 一次都没量过。**这是它排上来的唯一理由。**
#
# ★ 不要把这条说成"有机理支撑"。方向确实可以编一个（λ↑ ⟹ GAE 更接近蒙特卡洛
#   ⟹ 偏差↓方差↑ ⟹ 优势更不容易被 critic 抹平，而本项目病症正是 |A| 塌到 0.33），
#   **但那是事后叙事**。真实状态是"不知道"—— 本项目在
#   `minibatch` 那条上刚吃过一次亏：机理讲得很顺，实测被证伪。
#
# ### 成本与破坏面
#
# · 不动任何张量形状 ⟹ **不需要 BC 起点迁移**（对比 `prediction_horizon` 会改
#   `edge_scorer` 的输入维度，必须迁移权重）。这是它便宜的原因。
# · 1 维扫描、3 臂、30 轮、8 线程，约 50 分钟。
#
# ### 判据（跑之前写死）
#
# n=3（df=2）分辨率约 0.035；历史单种子抖动 0.012。所以：
#   |Δ| 可测 ⟹ 有结论；否则一律报「以 n=3 测不出」，**不报「没影响」**。
#
# ★★ 对照必须是 `ent01_rerun_s{42,43,44}`（**本节点**重跑的干净对照）。
#    `ent01_t8_s{42,43,44}` 是跨节点搬来的，**含 ~0.0197 硬件偏置，禁止再用作对照**。
#    详见 docs/训练诊断记录.md「★★★ 重标定终判」。
#
# ### 本文件必须排在 train_full_rl.yaml / train_ent01.yaml **之后**（后覆盖前）
#
# 用法：
#   /opt/qkd/venv/bin/python -u scripts/train/train_graph_mappo.py \
#       --configs rl_algorithm.yaml train_full_rl.yaml train_ent01.yaml train_gae99.yaml \
#       --checkpoint outputs/supervised_pg_phased/supervised_pg_phased_latest.pt \
#       --seed 42 --num-updates 30 --run-name gae99_s42
