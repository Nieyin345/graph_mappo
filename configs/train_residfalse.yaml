# 结构假设：`model.encoder.residual: true → false`（**不改维度** ⟹ 保 BC 暖启动）
# ══════════════════════════════════════════════════════════════════════════
# 一、为什么是这条（与今晚唯一显著结果同一条机理线）
# ══════════════════════════════════════════════════════════════════════════
#
# 今晚确立的三点构成**同一条机理线**——「**节点表示如何聚合信息**」：
#
#   ① `demand_edge`（**去掉**链路上下文）      Δ = **−0.0646**  ★ 显著更差（9/9, p=0.004）
#   ② `layers4`    （扩大感受野 3→4 层）       Δ = +0.0055      测不出（4/5 为正）
#   ③ 本臂         （关掉 residual）           方向**可预测**
#
# `graph_mappo.py:399`：
#     node_emb = node_emb + next_node_emb if self.residual else next_node_emb
#
# **关掉 residual ⟹ 每层「覆盖」而非「累加」** ⟹ 浅层信息更早被冲掉。
# 若 ①（"节点需要链路上下文"）成立，② 说明"3 层够用"（不是层数不足），
# 那 ③ 应当**有害**（信息被冲掉）—— 这给本臂一个**可预判的方向**。
#
# ⟹ 三点连起来给一个**完整的结构论断**，比单个旋钮有价值。
#   （① 是一端、② 是另一端、③ 检验"累加是否必要"）
#
# ══════════════════════════════════════════════════════════════════════════
# 二、代价：**零**（不碰参数）
# ══════════════════════════════════════════════════════════════════════════
#
# `residual` 只是前向的一个分支，**没有任何参数** ⟹
# 维度不变、**BC 暖启动必然逐位完整**（预检验证）。
# ⟹ 落 **BC 族**（可检测效应 ~0.008~0.045）。
#
# ══════════════════════════════════════════════════════════════════════════
# 三、全库从未扫过
# ══════════════════════════════════════════════════════════════════════════
#
# `.tmp/probe_knobs.py`：`model.encoder.residual` 取值个数 = **1**（全 true）。
# 与 `dropout` 不同，它**不改变 `build_mlp` 的结构** ⟹ 不会引起键名位移
# （见 §二十一 的教训）。
#
# ══════════════════════════════════════════════════════════════════════════
# 四、判据（预注册，**有方向**）
# ══════════════════════════════════════════════════════════════════════════
#
# 对照臂：`ent01_rerun_s{42..46}`；窗口 u25/30；族级配对 n=5（df=4，临界 2.776）
# + **报可检测效应**。
#
#   Δ ≤ −0.020 且 5/5 同向 ⟹ **累加是必要的**（与 ① 同向，机理线自洽）
#   Δ ≥ +0.020 且 5/5 同向 ⟹ **覆盖反而更好**（浅层信息是噪声 ⟹ 与 ① 张力）
#   |Δ| < 0.020 ⟹ 测不出
#
# ⚠ 本臂的**预期方向是负**（基于 ② 的结论：3 层够用 ⟹ 层间累加承载信息）。
#   若测出为正，那是对机理线的**反例**，价值更大。
#
# ⚠ 本文件必须排在 `train_ent01.yaml` **之后**（后覆盖前）。
model:
  encoder:
    residual: false
