# `storage_reward_weight: 0.5 → 5.0`（剂量档 1：10×）
# ══════════════════════════════════════════════════════════════════════════
# 一、为什么是这条
# ══════════════════════════════════════════════════════════════════════════
#
# `docs/训练诊断记录.md:14691` 的结论：
# > **`storage_reward` 是活的**（每步在跑、有非零梯度，与恒 0 的那些不同），
# > 但 `served/storage = 647.8 倍 = 2.81 个数量级`
# > ⟹ **以现在的权重它几乎不可能是有效驱动**。
#
# 实测（本次）：`storage/served = 0.141%`。
#
# 机理（`reward.py:333`）：
#   奖励 = `storage_weight × (本槽新增且未被消费的量) × storage_pathness`
#   其中 `storage_pathness`（`env.py:232` 生产）标记「该边在**待办请求的可用路径**上」
# ⟹ 它奖励的是「**在会被用到的边上预存**」，**正对已知瓶颈**
#   （最弱跳局部饥荒，`key-pool-is-not-the-bottleneck`）。
#
# ⚠ 但那条记忆同时警告：**"只罚总量的密钥效率项可能有害"** ——
#   本项不同，它是**定向**的（乘以 pathness），不是只罚总量。
#
# ══════════════════════════════════════════════════════════════════════════
# 二、为什么是 5.0 而不是 38（一上来 ×76）
# ══════════════════════════════════════════════════════════════════════════
#
# 记忆明确写：「**不要一上来就 ×76**：那会把 storage 抬成**并列主导项**
# （与 served 同量级），是一次巨大的干预，不可解释。」
#
# 本臂取 **10×**（0.5 → 5.0）作**第一档**：仍远小于 served，
# 但把信号从 0.014% 抬到 ~1.4%（可测范围）。
# 若有效再单独扫 20 / 38。
#
# ══════════════════════════════════════════════════════════════════════════
# 三、代价：**零**（不碰模型）
# ══════════════════════════════════════════════════════════════════════════
#
# 奖励是标量，不进模型 ⟹ **维度不变、BC 暖启动逐位完整**（预检已验）。
# ⟹ 落 **BC 族**（可检测效应 ~0.008~0.045）。
#
# ══════════════════════════════════════════════════════════════════════════
# 四、全库从未扫过
# ══════════════════════════════════════════════════════════════════════════
#
# 73/73 条臂的 `resolved_config.yaml` 全是 `storage_reward_weight: 0.5`。
#
# ══════════════════════════════════════════════════════════════════════════
# 五、判据（预注册）
# ══════════════════════════════════════════════════════════════════════════
#
# 对照臂：`ent01_rerun_s{42..46}`
# 窗口 u25/30；族级配对 n=5（df=4，临界 2.776）+ **报可检测效应**
#
#   Δ ≥ +0.020 且 5/5 同向 ⟹ **定向预存奖励有效**（对瓶颈的正向干预）
#   Δ ≤ −0.020 ⟹ 有害（与记忆的"只罚/只奖总量可能有害"一致）
#   |Δ| < 0.020 ⟹ 测不出（因落 BC 族，这会是**强结论**：影响 < 可检测值）
#
# ⚠ **判据是配对的 success_rate，不是 storage 项本身变大**（记忆明确）。
#
# ⚠ 本文件必须排在 `train_ent01.yaml` **之后**（后覆盖前）。
reward:
  storage_reward_weight: 5.0
