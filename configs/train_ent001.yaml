# ============================================================================
# 定案实验 A0：entropy_coef = 0.001（**在本节点跑**）
# ============================================================================
#
# ## 为什么要跑这个
#
# `entropy_coef` 曾是本项目的「最强单参数线索」（0.01 优于基线的 0.001）。
# 2026-09-20 复核发现 **n=5「超过专家 p=0.0074」是节点混淆**：
#
#   · 五个种子整批跑在**旧节点** amd238（u1 逐位 = ent01_t8_s*）
#   · Δ vs 专家 = +0.0180，而本节点硬件偏置 = **+0.0197** ⟹ 去偏置后 −0.002
#   · **专家锚实测是节点无关的**（纯启发式打分+argmax，无 matmul 无 BLAS），
#     所以「臂 vs 专家」的偏置**不抵消**（与「臂 vs 臂」不同）
#
# 三把刀（详见 docs/训练诊断记录.md「★★★ entropy_coef 线索」节）：
#   1. 同节点对照（`ent01_s42_u25_base`，只把 ent 翻回 0.001）方向**相反**
#   2. 新节点上**没有任何** ent=0.001 的臂，无法配对照
#   3. 没有任何一处同节点对照支持「0.01 优于 0.001」
#
# ## 判据（跑之前写死，不许事后改）
#
#   对照 = `ent01_rerun_s{42,43,44}`（本节点、8 线程、同一 BC 起点）
#   臂   = `A0_s{42,43,44}`（BASE 与之逐项相同，**只差 entropy_coef**）
#
#   · |Δ| < 0.035（单训练种子分辨率）⟹ **「测不出」⟹ 正式关闭这条线索**
#   · Δ ≥ +0.035（A0 明显低于 ent01_rerun）⟹ 线索**复活**，且这次是干净的
#   · Δ ≤ −0.035 ⟹ 0.001 反而更好，同样关闭「0.01 有效」的说法
#
# ## ★★ 启动纪律（这里踩过一次，见记忆 chain-baseline-can-go-stale）
#
# 配置链是**后面的覆盖前面的**，本文件必须在 `train_ent01.yaml` **之后**出现，
# 否则 0.01 会把 0.001 盖回去。正确的 BASE：
#
#   --configs rl_algorithm.yaml train_full_rl.yaml train_ent01.yaml train_ent001.yaml
#
# 本文件只写 0.001 这一项，其余全部继承 —— 这样与 ent01_rerun 的差异
# **恰好一项**，可以用 `.tmp/cfg_check.py` 逐字段 diff 验证（差异数必须为 1）。
# ============================================================================

train:
  ppo:
    entropy_coef: 0.001
