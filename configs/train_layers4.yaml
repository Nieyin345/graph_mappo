# 结构假设：`model.encoder.num_layers: 3 → 4`（**不改维度** ⟹ 保 BC 暖启动）
# ══════════════════════════════════════════════════════════════════════════
# 一、为什么是这条（机理直连今晚的显著结果）
# ══════════════════════════════════════════════════════════════════════════
#
# 今晚实测：`model.mode: mixed → demand_edge` **显著更差 6.5 点**
# （n=9，Δ=−0.0646，t=−3.986，p=0.004，**9/9 同向**）。
# ⟹ 结论：**节点表示需要链路上下文**，「节点邻域内的链路状况」是有用信息。
#
# 而 `num_layers` **正是**「节点能看到几跳外的链路」的旋钮：
# GNN 每多一层，节点的感受野扩一跳。
#
# ⟹ 本臂是那条结论的**正向推论**：
#   若"需要链路上下文"成立，那么**加大感受野**应当有帮助。
#   （`demand_edge` 是**去掉**上下文 ⟹ 变差；本臂是**扩**上下文 ⟹ 应变好）
#
# ══════════════════════════════════════════════════════════════════════════
# 二、全库从未扫过
# ══════════════════════════════════════════════════════════════════════════
#
# `.tmp/probe_knobs.py` 扫 53 条臂：`model.encoder.num_layers` 取值个数 = **1**（全是 3）。
#
# ══════════════════════════════════════════════════════════════════════════
# 三、代价已实测（`probe_layers_precheck.py`）
# ══════════════════════════════════════════════════════════════════════════
#
# ```
#   层数   加宽  丢弃  缺失  多余
#     3      0     0     0     0     ← 基线
#     4      0     0    24     0     ✓ 丢弃 0
#     5      0     0    48     0     ✓ 丢弃 0
# ```
#
# ★ **丢弃 0 键** ⟹ 已有的 3 层逐位加载，**第 4 层从零学**
#   （同 `checkpoint-can-upgrade-instead-of-drop` 的"加宽补零"逻辑，只是这里是"加层"）。
# ★ **维度不变**：`edge_dim=44`、`node_dim=17`（与 L=3 相同）。
# ★ 参数量：1,053,188 → 1,333,508（+26.6%）。
#
# ⟹ **落在 BC 族**（可检测效应 ~0.008~0.045），不是从零训的高方差族。
#
# ══════════════════════════════════════════════════════════════════════════
# 四、只改这一个点
# ══════════════════════════════════════════════════════════════════════════
#
#   `model.encoder.num_layers`: 3 → 4
#   其余全部不动（含 `hidden_dim`、pooling、BC 起点、奖励、窗口、线程数）。
#
# ⚠ 只加一层（3→4），**不一次加两层**（4 是分辨率够的最小改动；
#   若 4 有效再单独扫 5）。
#
# ⚠ 本文件必须排在 `train_ent01.yaml` **之后**（后覆盖前）。
model:
  encoder:
    num_layers: 4
