# 结构假设：`model.mode: mixed → demand_edge`（**不改维度** ⟹ 可带 BC 起点）
# ══════════════════════════════════════════════════════════════════════════
# 一、本臂解决的问题：**绕开 §十五 的死结**
# ══════════════════════════════════════════════════════════════════════════
#
# 2026-09-21 夜班确立的死结：
#   改特征 ⟹ 改 `edge_dim`/`node_dim` ⟹ 变窄补零救不回
#   （`checkpoint-can-upgrade-instead-of-drop` 只能救变宽）
#   ⟹ 必须从零训 ⟹ 族内 SD 0.2 ⟹ 可检测效应 0.17 ⟹ **测不出**。
#
# **本臂改的是架构分支，不是维度**：
#   `graph_mappo.py:785`  `fuse_physical_to_node=(self.mode == "mixed")`
#   物理链路的 message 是否并入节点表示 —— 只改**数据流**，不改任何张量形状。
#   ⟹ `edge_dim` / `node_dim` 不变 ⟹ **BC 暖启动照常加载**
#   ⟹ 落在 **BC 族**（可检测效应 **0.0081**，比从零族紧 20 倍）。
#
# ══════════════════════════════════════════════════════════════════════════
# 二、为什么是这条（项目自己的 P1）
# ══════════════════════════════════════════════════════════════════════════
#
# `docs/当前状态与优化方向.md` 的 P1 表把它列为
# 「**唯一能便宜检验结构假设的旋钮** —— 不改任何权重形状 → BC 照常加载、
#   **可直接与 ent01 配对**」。
#
# 语义（`graph_mappo.py:420-424` 的注释）：
#   mixed（现在）—— 物理链路 message **并入**节点表示。
#   demand_edge —— 编码器**不把物理链路 message 放进节点表示**，
#     于是节点嵌入只携带**动态需求**信号，不被**原始链路速率**污染；
#     actor 因此在 `relay_importance` 为空的槽上**也能看见待办需求**。
#
# ⟹ 这是「**节点表示该不该被链路速率污染**」这个结构问题的干净对照。
#
# ══════════════════════════════════════════════════════════════════════════
# 三、全库从未跑过（已核实）
# ══════════════════════════════════════════════════════════════════════════
#
# `.tmp/probe_knobs.py` 扫 53 条臂的 `resolved_config.yaml`：
#   `model.mode` 取值个数 = **1**（全是 `"mixed"`）⟹ 该旋钮从未被本库变过。
# 记忆 `ablation-name-is-not-the-parameter` 的教训：**从未测过 ≠ 测不出**。
#
# ══════════════════════════════════════════════════════════════════════════
# 四、只改这一个点
# ══════════════════════════════════════════════════════════════════════════
#
# ⚠ **不套用 `train_profiles.yaml` 里的 `demand_edge` profile** —— 那个 profile
#   顺带改了 `relay_importance.max_path_links 8→3`、`hop_decay_factor 0.8→0.25`
#   （**两个变量**）。本文件**只写 `model.mode`**。
#
# ⚠ 本文件必须排在 `train_ent01.yaml` **之后**（后覆盖前）。
model:
  mode: demand_edge
