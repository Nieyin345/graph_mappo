# ══════════════════════════════════════════════════════════════════════════
# urgency 加权等待惩罚 —— 剂量对照组的公共说明
# ══════════════════════════════════════════════════════════════════════════
#
# 一、机制（`qkd_rl/env/reward.py` + `qkd_rl/env/request.py`）
# ══════════════════════════════════════════════════════════════════════════
#
# 每个**未被服务**的请求按**剩余时间**加权后被罚：
#
#     urgency(req) = 1 − 剩余步数 / deadline_steps        （0 = 刚到，1 = 快死）
#     penalty      = urgency_wait_weight × Σ urgency × 剩余量 / served_reference
#
# 逐 step 计算 ⟹ **及时**（不是事后追罚），且**不规定服务顺序**
# （模型自己决定先做谁，只是「救快死的」被奖励得更多）。
#
# 与 `waiting_penalty`（现有的平量积压惩罚）的区别：
#   · `waiting_*` 罚「积压了多少」——「还剩 2 步」和「还剩 25 步」**罚一样多**
#   · `urgency_wait_*` 罚「积压的有多急」——前者罚得多约 10 倍
# ⟹ 只有 urgency 项会告诉模型**优先救谁**。served / failed 两项对
#   urgency **都不敏感**（服务 1 个 key 恒定给 5e-4，不管多急），
#   所以那两项定的是「水平」，只有这一项定「方向」。
#
# 二、量级（★ 2026-09-21 修正：先前版本多除了一个 served_reference）
# ══════════════════════════════════════════════════════════════════════════
#
# 一个请求活满 `deadline_steps=30` 步，urgency 从 0 线性涨到 1，
# 它**一生累计**的加权量（相对自身量 A）= Σ_{k=0}^{29} k/30 = **14.5**
#
# 令「一生的等待惩罚」=「过期一次罚的量」：
#
#     w × A × 14.5 / served_reference  =  failed_weight × A / served_reference
#     ↑ 两边分母相同，**约掉**                              ↑ 同一个分母
#     ⟹ w × 14.5 = failed_weight = 5
#     ⟹ **w = 5 / 14.5 ≈ 0.345**
#
# ⚠ 先前写的 3.2e-6 是错的：把 `failed_weight/served_reference` 当成"每 key 罚"
#   后又除以 15.5，等于**多除了一次 1e5**。被造反证抓到（手算 vs env 差 549 倍）。
#
# 三、剂量臂（同一机制，只改强度）
# ══════════════════════════════════════════════════════════════════════════
#
#   u0（对照）  urgency_wait_enabled: false             ← 现状，不加新项
#   u1（0.5×）  urgency_wait_weight: 0.17
#   u2（1×）    urgency_wait_weight: 0.35               ← 上面推的平衡点
#   u3（2×）    urgency_wait_weight: 0.70
#   u4（4×）    urgency_wait_weight: 1.40               ← 上界，测"过强会不会伤成功率"
#
# ⚠ **起跑值是推导的，不是实测的**。实测（`.tmp/probe_urgency_magnitude.py`，
#   专家策略）给出 `Σ urgency×剩余量 / 平量积压 = 0.36`，与「年龄均匀」的
#   预期一致 ⟹ 机制确实有区分度（不是恒 0）。
#
# ⚠ 与 `waiting_enabled` **互斥**：两个都开会让「积压」被罚两次。
#   本组实验保持 `waiting_enabled: false` 不动。
#
# ⚠ `reward_scale` 暂不重标：1× 时新项约占 served 项的 3%（未缩放 0.97 vs 33.5），
#   不改变总尺度。若最高剂量臂仍偏弱，再考虑调 scale。
#
# ⚠ 本文件必须排在 `train_ent01.yaml` **之后**（后覆盖前）。

reward:
  # 基线的这三项**不动**：它们定「水平」，不定「方向」
  #   served_weight: 50.0        （服务成功奖励）
  #   failed_weight: 5.0         （过期失败惩罚）
  #   waiting_enabled: false     （平量积压惩罚，与本项互斥）
  urgency_wait_enabled: true
  urgency_wait_weight: 0.35
