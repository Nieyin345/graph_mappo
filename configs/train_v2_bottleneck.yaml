# v2：同一列 `include_on_pending_path`，**换语义**——从「在通路上」换成
#     「决定这条请求吞吐的那一跳（瓶颈跳）」——**只改这一个点**
#
# ══════════════════════════════════════════════════════════════════════════
# 一、这一版改了什么（v1 → v2）
# ══════════════════════════════════════════════════════════════════════════
#
#   v1  `_compute_on_pending_path`：在「有存量的边」子图上对每条 pending 请求
#       取最短路，路径**并集**里的边记 1。
#
#   v2  `_compute_on_pending_path`：对每条 pending 请求取它的**规范路**
#       （`routing.shortest_path(src,dst)`），在**这条路**上取**存量最小**的一跳，
#       只记那一跳为 1。
#
# **不开新开关、不加新维度**（末维仍是 45）⟹ 暖启动权重逐位可复用
# （`checkpoint-can-upgrade-instead-of-drop`：末维不变者不在讨论范围）。
#
# 代码改动两处：
#   qkd_rl/env/graph_builder.py  `_compute_on_pending_path` 重写
#                                + `GraphBuilder.__init__` 加 `routing=None`、`self.routing`
#   qkd_rl/env/factory.py        `GraphBuilder(...)` 传 `routing=routing`
#
# ══════════════════════════════════════════════════════════════════════════
# 二、依据（四层实测，全部在**真实验证协议**上只读；探针在 .tmp/）
# ══════════════════════════════════════════════════════════════════════════
#
# ① **服务吞吐 = 最弱一跳**：`routing.py:238`
#    `serve_now = min(hop_levels + [remaining])`，`consume_path` 再从**每一跳**
#    等量扣除。⟹ 在**非瓶颈跳**上生成密钥，对这条请求吞吐的贡献**恰好 0**。
#    两种情形（有跳为空 → 第一个空跳闸住；全有货 → 最小值闸住）都落在
#    `argmin(hop_levels)` 上。
#
# ② **路径由环境定、策略够不着**（`probe_path_is_fixed.py`）：
#    `_usable_cached_path` 优先用 `shortest_path`（纯拓扑**常量**）——
#    211 个 (src,dst) 对、4128 次**每次重算**比对、**0 次变化**；
#    路不通才回退 `_find_positive_path`，其 BFS 走的是 `prepare_serve` 建的
#    **静态拓扑 × qkp.positive** 子图（`routing.py:141-171`），**不读 agent
#    激活了哪些边**（判据②：`_usable_cached_path 非 None ⟺ 每跳有货`，3163 次
#    比对 0 不符）。
#    ⟹ 策略**唯一的杠杆是"把货生成在哪"**。实测 1978 条边**全部**在动作候选里
#    （`probe_canon_stock.py`，可触达 100%）⟹ **动作空间不是瓶颈**。
#
# ③ **v1 的列对被卡的请求几乎全 0**（`probe_onpath_silence.py`，15 种子 × 240 步）：
#       pending 请求合计      30,796
#       v1 标记过的            3,435 = **11.15%**
#       全物理图可达          25,204 = 81.84%
#       **被卡住且特征全 0**  21,769 = **70.69%**
#    ⟹ 恰恰是**最需要被指出**的那些请求，v1 一个字都没说。
#
# ④ **规范路本身几乎从不全通**（`probe_canon_stock.py`，4614 样本）：
#    「有货跳占比」的**上界够不到 0.7**（mean 9.83%，路长 mean 2.18），
#    79.32% 落在 [0.0,0.1)。⟹ 服务主要靠正存量子图上的 BFS 回退，
#    而回退路径上**服务量 = min(hop_levels) 仍然成立**。
#
# ⟹ 全仓观测里**没有任何"路径下界"的量**：`relay_importance` 是乘性权重的**求和**、
#    `req_hop` 是**距离**、节点那列是**求和** —— 都不是下界。v2 补上的正是这个
#    `min` 的 **argmin**。
#
# 五、代码正确性（`probe_v2_bottleneck.py`，720 步，全绿）
#    ① 集合精确比对 vs 独立重算：**对称差 0**；对照"真删一个元素"695/695 咬得住
#    ② 只标规范路上的边：**0 次违规**
#    ③ 标的就是最小：**0 次违规**
#    ④ 覆盖（分母 = 有规范路的请求）：**100.00%**（v1 是 11.15%）
#
# 六、惰性（`probe_v2_inert.py`，造反证）
#    把 `_compute_on_pending_path` 换成炸弹：
#      基线（开关 false）**不抛** ✓   v1（开关 true）**抛了** ✓（正对照：炸弹是响的）
#    ⟹ 本改动对基线配置**零影响** ⟹ 对照臂 `ent01_rerun_s*` **仍是干净对照**
#    （该批臂跑在 v2 补丁之前，但基线路径根本不经过被改函数）。
#
# ══════════════════════════════════════════════════════════════════════════
# 三、预注册判据（**先写死**，避免事后挑窗口）
# ══════════════════════════════════════════════════════════════════════════
#
#   对照臂：`ent01_rerun_s{42,43,44,45,46}`（entropy_coef 0.01 + 暖启动）
#           与 v1 用的是**同一个**对照 ⟹ v2 vs 基线、v2 vs v1 都能读。
#
#   臂名：`v2_bottleneck_s{42,43,44,45,46}`
#
#   ★ 主判据窗口 = **u25, u30**（与 `scripts/diag/paired_verdict.py` 的默认
#     `--plateau 25,30` 一致，也与 v1、gae90 的预注册窗口一致）。
#     `verdict-window-is-part-of-the-claim`：判据的窗口是结论的一半。
#
#   主判据：同训练种子配对（n=5，df=4，临界 **2.776**）
#           **Δ ≥ +0.020 且 5/5 同向**（比 v1 的 3/3 更严：n 大了就该更严）
#   反向  ：Δ ≤ −0.010 ⟹ 这条信息**有害**，撤回
#   居中  ：|Δ| < 0.010 ⟹ 判「换语义也没用」，转去查**动作空间的相位问题**
#           （候选 1978 条边全可触达，但 90 个端口怎么分配是另一件事）
#
#   副判据：**逐轮 Δ 全轨迹 u1→u30**（不带窗口）。用途是看**结构**：
#           "整体上移"与"早负晚正交叉"含义完全不同 —— gae90 那次就是只在
#           u25/u30 过线、早期显著为负，所以只能写"交叉"不能写"提升"。
#
#   ⚠ 配对不是可选（`docs/测试规范.md` §4）：逐种子成功率跨 0.29–0.88，
#     不配对时 15 种子 SE≈0.062，配对后 ≈0.012。0.02 的差距必须配对才测得出。
#   ⚠ 独立性限制：五条臂与五条对照都从**同一个 BC checkpoint** 长出来、共享早段
#     路径 ⟹ 配对差 d_s 在种子间**不完全独立**。结论只能写「在该共同起点下的
#     这 5 个种子上」，**不能**写"独立复现"。
#   ⚠ 不要把 v1 的 Δ+0.0154 当作 v2 的预期值——那是**另一套语义**的结果。
#
# ══════════════════════════════════════════════════════════════════════════
# 四、用法
# ══════════════════════════════════════════════════════════════════════════
#
#   python scripts/train/train_graph_mappo.py \
#       --configs rl_algorithm.yaml train_full_rl.yaml train_ent01.yaml \
#                 train_v2_bottleneck.yaml \
#       --checkpoint outputs/supervised_pg_phased/supervised_pg_phased_latest.pt \
#       --seed 42 --num-updates 30 --run-name v2_bottleneck_s42
#
# ⚠ 本文件必须排在 `train_ent01.yaml` **之后**（后覆盖前）。
features:
  edge:
    include_on_pending_path: true
